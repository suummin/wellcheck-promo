// 글씨 크기 −/+ : 고른 글자의 첫 글자 크기에서 한 단계씩 (0 = 기본 크기로). 굵게는 유지
const SIZE_PCT = { 1: 75, 2: 85, 3: 100, 4: 120, 5: 145, 6: 170 };
function rteCurSize(k) {
  const area = document.getElementById('cf-' + k), sel = getSelection();
  if (!area || !sel.rangeCount) return 3;
  const r = sel.getRangeAt(0);
  let n = r.startContainer;
  if (n.nodeType === 1 && n.childNodes[r.startOffset]) n = n.childNodes[r.startOffset];
  if (!area.contains(n)) return 3;
  for (; n && n !== area; n = n.parentNode) if (n.tagName === 'FONT' && n.getAttribute('size')) return Number(n.getAttribute('size')) || 3;
  return 3;
}
function rteSizeUI(k) {
  const cur = rteCurSize(k), pct = document.getElementById('rsz-' + k);
  if (!pct) return;
  pct.textContent = SIZE_PCT[cur] + '%';
  document.getElementById('rsz-dn-' + k).disabled = cur <= 1;
  document.getElementById('rsz-up-' + k).disabled = cur >= 6;
}
function rteStep(k, d) {
  const area = document.getElementById('cf-' + k);
  area.focus();
  const next = d ? Math.min(6, Math.max(1, rteCurSize(k) + d)) : 3;
  document.execCommand('styleWithCSS', false, false);
  document.execCommand('fontSize', false, String(next));
  rteSave(k); rteSizeUI(k);
}
document.addEventListener('selectionchange', () => {
  const a = document.activeElement;
  if (a && a.classList && a.classList.contains('rte-area')) rteSizeUI(a.id.slice(3));
});
document.addEventListener('keydown', e => {   // 스프레드시트처럼 Ctrl+[ / Ctrl+] 로도 조절
  const a = document.activeElement;
  if (!(e.ctrlKey || e.metaKey) || !a || !a.classList || !a.classList.contains('rte-area')) return;
  if (e.key === ']' || e.key === '[') { e.preventDefault(); rteStep(a.id.slice(3), e.key === ']' ? 1 : -1); }
});
function rteCmd(k, cmd, val) {
  const area = document.getElementById('cf-' + k);
  area.focus();
  document.execCommand('styleWithCSS', false, false);
  if (cmd === 'bold') document.execCommand('bold');
  else if (cmd === 'clear') document.execCommand('removeFormat');

}
function rteSave(k) {
  const area = document.getElementById('cf-' + k);
  // 줄(div) 단위로 안전한 서식만 남겨 \n 으로 이어 저장
  const lines = [];
  const blocks = [...area.childNodes];
  let buf = document.createElement('div');
  const flush = () => { lines.push(richWalk(buf).replace(/(<br>)+$/, '')); buf = document.createElement('div'); };
  blocks.forEach(n => { if (n.nodeType === 1 && (n.tagName === 'DIV' || n.tagName === 'P')) { if (buf.childNodes.length) flush(); buf.appendChild(n.cloneNode(true)); flush(); } else buf.appendChild(n.cloneNode(true)); });
  if (buf.childNodes.length) flush();
  const v = lines.map(l => l.split('<br>').join('\n')).join('\n').replace(/\n+$/, '');
  setContent(k, v);
}
function setContent(k, v) {

function statMonths() {
  const now = new Date(), r = ui.stats.range;
  let start, end = new Date(now.getFullYear(), now.getMonth(), 1);
  if (r === '6m') start = new Date(now.getFullYear(), now.getMonth() - 5, 1);
  else if (r === '12m') start = new Date(now.getFullYear(), now.getMonth() - 11, 1);
  else if (r === 'ytd') start = new Date(now.getFullYear(), 0, 1);
  else { start = new Date(now.getFullYear() - 1, 0, 1); end = new Date(now.getFullYear() - 1, 11, 1); }

  for (let d = new Date(start); d <= end; d.setMonth(d.getMonth() + 1)) out.push(ym(d));

}
const prevMonth = m => { const [y, mo] = m.split('-').map(Number); return ym(new Date(y, mo - 2, 1)); };

function statRecords() {

    recs.push({ month: ym(toDate(o.createdAt)), date: fmtD(o.createdAt), itemId: Number(l.id), name: nameOf(l.id, l.name), category: catOf(l), qty: Number(l.qty), key: o.orderId, org: o.org })));

          return `<tr><td>${esc(r.name)}</td><td><span class="chip ${r.category}">${CATS[r.category]}</span></td><td class="num"><b>${nf(r.qty)}</b></td><td class="num">${nf(p)}</td>

  charts.items = new Chart($('#ch-items'), { type: 'bar', data: { labels: ranked.map(r => r.name), datasets: [{ label: `${lbl} 수량`, data: ranked.map(r => r.qty),

/* ── 기간 추이 ── */
// 품목마다 고정 슬롯을 주고, 8색을 넘으면 같은 색을 점선·점 무늬로 구분 (색만으로 구분하지 않음)
const DASHES = [[], [6, 4], [2, 3]];
const slotStyle = i => ({ color: SERIES[i % 8], dash: DASHES[Math.floor(i / 8) % 3] });
function swatch(i) { const st = slotStyle(i); return `<i class="sw" style="border-top:3px ${st.dash.length ? (st.dash[0] > 3 ? 'dashed' : 'dotted') : 'solid'} ${st.color}"></i>`; }

function renderStatsTrend(head) {
  const s = ui.stats, months = statMonths(), [lbl, unitWord] = STAT_BASIS[s.basis];
  const recs = statRecords().filter(r => months.includes(r.month));
  const totalQty = recs.reduce((a, r) => a + r.qty, 0);
  const keys = new Set(recs.map(r => r.key)).size;
  const orgs = new Set(recs.filter(r => r.org).map(r => r.org.replace(/\s/g, ''))).size;
  const byItem = {};
  recs.forEach(r => { const t = byItem[r.itemId] || (byItem[r.itemId] = { id: r.itemId, name: r.name, category: r.category, qty: 0, m: {} }); t.qty += r.qty; t.m[r.month] = (t.m[r.month] || 0) + r.qty; });
  const ranked = Object.values(byItem).sort((a, b) => b.qty - a.qty);
  if (!s.picked) s.picked = ranked.slice(0, 5).map(r => r.id);
  s.picked = s.picked.filter(id => byItem[id]);
  Object.keys(s.slots).forEach(id => { if (!s.picked.includes(Number(id))) delete s.slots[id]; });
  s.picked.forEach(id => { if (s.slots[id] == null) { const used = Object.values(s.slots); let i = 0; while (used.includes(i)) i++; s.slots[id] = i; } });
  $('#sec-stats').innerHTML = head + `
    <div class="kpis">
      <div class="kpi"><div class="k-label">${lbl} 총 수량</div><div class="k-val">${nf(totalQty)}</div></div>
      <div class="kpi"><div class="k-label">${unitWord} 수</div><div class="k-val">${nf(keys)}<small>건</small></div></div>
      <div class="kpi"><div class="k-label">월 평균 수량</div><div class="k-val">${nf(Math.round(totalQty / months.length))}</div></div>
      ${s.basis === 'order' ? `<div class="kpi"><div class="k-label">신청 기관 수</div><div class="k-val">${nf(orgs)}<small>곳</small></div></div>` : ''}
    </div>
    <div class="card"><div class="card-title">월별 ${lbl} 수량 <span class="sub">인쇄물 / 마케팅판촉물 · 막대를 누르면 그 달의 월별 조회로 이동</span></div>
      <div class="legend"><span><i style="background:var(--s-print)"></i>인쇄물</span><span><i style="background:var(--s-banner)"></i>마케팅판촉물</span></div>
      <div class="chart-box"><canvas id="ch-month" role="img" aria-label="월별 수량 막대 차트"></canvas></div></div>
    <div class="card"><div class="card-title">홍보물 종류별 추이 <span class="sub">${s.picked.length}/${ranked.length}개 선택</span>
        <span class="spacer" style="flex:1"></span>
        <button class="btn sm" onclick="pickAllStat(true)" ${s.picked.length === ranked.length ? 'disabled' : ''}>전체 선택</button>
        <button class="btn sm" onclick="pickAllStat(false)" ${s.picked.length ? '' : 'disabled'}>선택 해제</button></div>
      <div class="item-picker">${ranked.map(r => { const on = s.picked.includes(r.id);
        return `<button class="${on ? 'on' : ''}" aria-pressed="${on}" onclick="pickStatItem(${r.id})">${on ? swatch(s.slots[r.id]) : ''}${esc(r.name)}</button>`; }).join('') || '<span style="font-size:12px;color:var(--ink-3)">데이터 없음</span>'}</div>
      <div class="chart-box" style="height:340px"><canvas id="ch-item" role="img" aria-label="홍보물별 월별 추이 선 차트"></canvas></div></div>
    <div class="card"><div class="card-title">홍보물 × 월 상세표</div>
      ${ranked.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>홍보물</th><th>분류</th>${months.map(m => `<th class="num">${m.slice(2).replace('-', '.')}</th>`).join('')}<th class="num">합계</th><th class="num">비중</th></tr></thead><tbody>
        ${ranked.map(r => `<tr><td>${esc(r.name)}</td><td><span class="chip ${r.category}">${CATS[r.category]}</span></td>${months.map(m => `<td class="num">${r.m[m] ? nf(r.m[m]) : '<span style="color:#D1D5DB">-</span>'}</td>`).join('')}<td class="num"><b>${nf(r.qty)}</b></td><td class="num">${totalQty ? Math.round(r.qty / totalQty * 100) : 0}%</td></tr>`).join('')}
        </tbody><tfoot><tr><td colspan="2">합계</td>${months.map(m => `<td class="num">${nf(recs.filter(r => r.month === m).reduce((a, r) => a + r.qty, 0))}</td>`).join('')}<td class="num">${nf(totalQty)}</td><td class="num">100%</td></tr></tfoot></table></div>`
      : `<div class="empty"><i class="ti ti-chart-bar-off"></i>선택한 기간에 데이터가 없습니다.</div>`}
    </div>`;
  if (typeof Chart === 'undefined') return;
  chartDefaults();
  const labels = months.map(m => m.slice(2).replace('-', '.'));
  const sumCat = c => months.map(m => recs.filter(r => r.month === m && r.category === c).reduce((a, r) => a + r.qty, 0));
  charts.month = new Chart($('#ch-month'), { type: 'bar', data: { labels, datasets: [barSet('인쇄물', sumCat('print'), '#2a78d6'), barSet('마케팅판촉물', sumCat('banner'), '#eb6834')] },
    options: Object.assign(chartBase({ x: { stacked: true, grid: { display: false }, border: { display: false } }, y: { stacked: true, beginAtZero: true, grid: { color: '#F1F5F9' }, border: { display: false }, ticks: { precision: 0 } } }),
      { onClick: (e, els) => { if (els.length) { ui.stats.view = 'month'; ui.stats.month = months[els[0].index]; renderStats(); } },
        onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; } }) });
  charts.item = new Chart($('#ch-item'), { type: 'line', data: { labels, datasets: s.picked.map(id => { const st = slotStyle(s.slots[id]); return {
      label: byItem[id].name, data: months.map(m => byItem[id].m[m] || 0), borderColor: st.color, backgroundColor: st.color, borderDash: st.dash,
      borderWidth: 2, pointRadius: 3, pointHoverRadius: 5, cubicInterpolationMode: 'monotone' }; }) },
    options: chartBase({ x: { grid: { display: false }, border: { display: false } }, y: { beginAtZero: true, grid: { color: '#F1F5F9' }, border: { display: false }, ticks: { precision: 0 } } }) });
}
function pickStatItem(id) {
  const s = ui.stats;
  s.picked = s.picked.includes(id) ? s.picked.filter(x => x !== id) : [...s.picked, id];
  renderStats();
}
function pickAllStat(on) {
  const months = statMonths(), ids = [...new Set(statRecords().filter(r => months.includes(r.month)).map(r => r.itemId))];
  ui.stats.picked = on ? [...ui.stats.picked, ...ids.filter(id => !ui.stats.picked.includes(id))] : [];
  renderStats();
}

/* ── 차트 공통 ── */
function chartDefaults() {
  Object.values(charts).forEach(c => c.destroy());
  Object.keys(charts).forEach(k => delete charts[k]);
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.color = '#6B7280';
}
function chartBase(scales) {
  return { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales,
    plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1F2937', padding: 10, boxPadding: 4,
      callbacks: { label: c => ` ${c.dataset.label}: ${nf(c.parsed[c.chart.options.indexAxis === 'y' ? 'x' : 'y'])}` } } } };
}
function barSet(label, data, color) { return { label, data, backgroundColor: color, borderRadius: 4, borderColor: '#fff', borderWidth: { top: 2 }, maxBarThickness: 36 }; }

function exportStats() {
  const s = ui.stats, lbl = { order: '신청', batch: '취합', in: '입고' }[s.basis];
  if (s.view === 'month') {
    const all = statRecords(), bi = statByItem(all.filter(r => r.month === s.month)), pbi = statByItem(all.filter(r => r.month === prevMonth(s.month)));
    DB.items.filter(it => it.active && !bi[it.id]).forEach(it => { bi[it.id] = { name: it.name, category: it.category, qty: 0, keys: new Set(), id: it.id }; });
    const rows = Object.values(bi).sort((a, b) => b.qty - a.qty).map(r => [r.name, CATS[r.category], r.qty, (pbi[r.id] || {}).qty || 0, r.qty - ((pbi[r.id] || {}).qty || 0), r.keys.size]);
    return saveXlsx(`웰체크_홍보물_통계_${lbl}_${s.month}.xlsx`, [{ name: `${s.month} ${lbl}`, rows: [['홍보물', '분류', '이번 달', '전월', '증감', STAT_BASIS[s.basis][1]], ...rows], widths: [32, 12, 10, 10, 10, 12] }]);
  }
  const months = statMonths(), recs = statRecords().filter(r => months.includes(r.month));
  const byItem = {};
  recs.forEach(r => { const t = byItem[r.itemId] || (byItem[r.itemId] = { name: r.name, category: r.category, m: {}, qty: 0 }); t.m[r.month] = (t.m[r.month] || 0) + r.qty; t.qty += r.qty; });
  const rows = Object.values(byItem).sort((a, b) => b.qty - a.qty).map(t => [t.name, CATS[t.category], ...months.map(m => t.m[m] || 0), t.qty]);
  saveXlsx(`웰체크_홍보물_통계_${lbl}_${months[0]}_${months[months.length - 1]}.xlsx`, [{ name: `${lbl}기준`, rows: [['홍보물', '분류', ...months, '합계'], ...rows], widths: [30, 12, ...months.map(() => 9), 10] }]);
}

/* ── 업무 플로우 편집: 단계 순서·이름 변경, 단계 추가·삭제. 다음 취합부터 적용 ── */

  return `<div class="doc-layout">

        바꾼 플로우는 <b>다음 취합부터</b> 적용되고, 이미 만들어진 체크리스트는 그대로입니다. 기본 단계에 붙은 기능(배송지 엑셀 받기, 송장 입력 등)은 이름을 바꿔도 유지됩니다.

        <span class="flow-no">${i + 1}</span>

        <select class="sel flow-doc ${s.doc ? 'on' : ''}" aria-label="${i + 1}번째 단계에 연결할 문서 양식" onchange="ui.settings.flowDraft['${ft}'][${i}].doc=this.value;renderSettings()">
          <option value="">문구 생성 없음</option>
          ${docs.map(d => `<option value="${d.k}" ${s.doc === d.k ? 'selected' : ''}>문구: ${esc(d.name)}</option>`).join('')}
          ${s.doc && !docs.some(d => d.k === s.doc) ? `<option value="${esc(s.doc)}" selected>(삭제된 양식)</option>` : ''}
        </select>
        <button class="btn sm ghost" ${i === 0 ? 'disabled' : ''} onclick="moveFlowStep('${ft}',${i},-1)" aria-label="위로"><i class="ti ti-arrow-up"></i></button>

        <button class="btn sm ghost danger" ${draft.length === 1 ? 'disabled' : ''} onclick="removeFlowStep('${ft}',${i})" aria-label="삭제"><i class="ti ti-trash"></i></button></li>`; }).join('')}</ol>
      <div><button type="button" class="btn sm" onclick="addFlowStep('${ft}')"><i class="ti ti-plus"></i>단계 추가</button></div>
      ${FLOW_DEFAULTS[ft].some(([k]) => !draft.some(s => s.k === k)) ? `<p class="sub-line">빠진 기본 단계: ${FLOW_DEFAULTS[ft].filter(([k]) => !draft.some(s => s.k === k)).map(([k, t]) => `<a href="#" onclick="restoreFlowStep('${ft}','${k}');return false">${esc(t)}</a>`).join(' · ')} (누르면 맨 뒤에 다시 추가)</p>` : ''}
      <div class="set-save">
        <button type="button" class="btn ghost" onclick="ui.settings.flowDraft['${ft}']=FLOW_DEFAULTS['${ft}'].map(([k,t])=>({k,t,doc:(DEFAULT_STEP_DOC['${ft}']||{})[k]||''}));renderSettings()">기본 플로우로 되돌리기</button>
        <span class="spacer"></span>
        ${changed.length ? `<span class="ed-dirty">저장 안 된 플로우 ${changed.length}개</span>` : ''}
        <button type="button" class="btn primary" onclick="saveFlows()"><i class="ti ti-device-floppy"></i>업무 플로우 저장</button></div>
    </section></div>`;
}
function moveFlowStep(ft, i, d) { const a = ui.settings.flowDraft[ft]; [a[i], a[i + d]] = [a[i + d], a[i]]; renderSettings(); }
function removeFlowStep(ft, i) { ui.settings.flowDraft[ft].splice(i, 1); renderSettings(); }
function addFlowStep(ft) { ui.settings.flowDraft[ft].push({ k: 'c' + Date.now().toString(36), t: '', doc: '' }); renderSettings(); const ins = document.querySelectorAll('.flow-list input'); ins[ins.length - 1].focus(); }
function restoreFlowStep(ft, k) { const d = FLOW_DEFAULTS[ft].find(x => x[0] === k); ui.settings.flowDraft[ft].push({ k, t: d[1], doc: (DEFAULT_STEP_DOC[ft] || {})[k] || '' }); renderSettings(); }
async function saveFlows() {
  const drafts = ui.settings.flowDraft || {};
  for (const k of Object.keys(drafts)) {
    drafts[k] = drafts[k].map(s => ({ k: s.k, t: String(s.t || '').trim(), doc: s.doc || '' })).filter(s => s.t);
    if (!drafts[k].length) return toast(`${JOB_TYPES[k]} 플로우에 단계가 하나 이상 있어야 합니다.`, true);
  }
  const w = workSettings();
  busy(true);
  try { await api('saveSettings', { workSettings: Object.assign({}, w, { flows: Object.assign({}, w.flows, drafts) }) }); ui.settings.flowDraft = {}; await refreshAll(); toast('업무 플로우를 저장했습니다. 다음 취합부터 적용됩니다.'); }
  catch (e) { toast(e.message, true); } finally { busy(false); }
}

/* ── 문서 양식: 양식(제목 + 문구)을 자유롭게 추가·수정·삭제. 업무 플로우의 단계에 연결해 문구 생성 ── */
function settingsDocs() {
  const w = workSettings(), base = docList(w);
  const list = ui.settings.docListDraft || (ui.settings.docListDraft = base.map(d => ({ k: d.k, name: d.name })));
  if (!list.some(d => d.k === ui.settings.doc)) ui.settings.doc = (list[0] || {}).k;
  const dk = ui.settings.doc, cur = list.find(d => d.k === dk), drafts = ui.settings.docDraft || {};
  const textOf = k => drafts[k] !== undefined ? drafts[k] : (w.docs[k] || '');
  const isChanged = d => (drafts[d.k] !== undefined && drafts[d.k] !== (w.docs[d.k] || '')) || !base.some(b => b.k === d.k && b.name === d.name);
  const dirty = list.filter(isChanged).length + base.filter(b => !list.some(d => d.k === b.k)).length + (JSON.stringify(list.map(d => d.k)) !== JSON.stringify(base.map(d => d.k).filter(k => list.some(d => d.k === k))) ? 1 : 0);
  const used = cur ? docUsage(cur.k) : [];
  const idx = list.indexOf(cur);
  return `<div class="doc-layout">
    <nav class="doc-nav" aria-label="문서 양식">${list.map(d => `<button class="${dk === d.k ? 'on' : ''}" data-k="${d.k}" onclick="switchDocTpl('${d.k}')"><i class="ti ti-file-text"></i><span class="nm">${esc(d.name) || '(제목 없음)'}</span>${isChanged(d) ? '<span class="dot-chg" title="저장 안 됨"></span>' : ''}</button>`).join('')}
      <button class="doc-add" onclick="addDocTpl()"><i class="ti ti-plus"></i>문서 양식 추가</button></nav>
    ${cur ? `<section class="set-sec doc-edit">
      <div class="field"><label for="ws-doc-name">문서 제목</label>
        <div class="row" style="gap:6px"><input class="inp" style="flex:1" id="ws-doc-name" value="${esc(cur.name)}" maxlength="40" placeholder="예) 배송비 발주 기안" oninput="renameDocTpl('${dk}',this.value)"/>
          <button type="button" class="btn sm ghost" ${idx === 0 ? 'disabled' : ''} onclick="moveDocTpl('${dk}',-1)" aria-label="위로"><i class="ti ti-arrow-up"></i></button>
          <button type="button" class="btn sm ghost" ${idx === list.length - 1 ? 'disabled' : ''} onclick="moveDocTpl('${dk}',1)" aria-label="아래로"><i class="ti ti-arrow-down"></i></button></div>
        <span class="help">${used.length ? `연결된 업무 단계: ${used.map(u => `<b>${esc(u)}</b>`).join(', ')}` : '아직 연결된 업무 단계가 없습니다. <a href="#" onclick="openSettingsTab(\'flow\');return false">업무 플로우</a>에서 단계에 연결하거나, 업무 일정의 [문구] 버튼으로 바로 쓸 수 있어요.'}</span></div>
      <div class="field"><label for="ws-doc">문구</label>
        <p class="help" style="margin-bottom:6px">회사 결재 양식의 문구를 그대로 붙여 넣고, 건마다 바뀌는 부분만 아래 변수로 바꾸세요. 변수를 누르면 커서 위치에 들어갑니다.</p>
        <div class="var-chips">${DOC_VAR_LIST.map(v => `<button type="button" onclick="insertDocVar('{${v}}')">{${v}}</button>`).join('')}</div>
        <textarea class="ta doc-ta" id="ws-doc" rows="14" data-key="${dk}" oninput="ui.settings.docDraft=Object.assign(ui.settings.docDraft||{},{[this.dataset.key]:this.value});markDocDirty()">${esc(textOf(dk))}</textarea></div>
      <div class="set-save">
        ${WORK_DEFAULTS.docs[dk] ? `<button type="button" class="btn ghost" onclick="$('#ws-doc').value=WORK_DEFAULTS.docs['${dk}'];$('#ws-doc').dispatchEvent(new Event('input'))">기본 문구로 되돌리기</button>` : ''}
        <button type="button" class="btn ghost danger" onclick="removeDocTpl('${dk}')"><i class="ti ti-trash"></i>이 양식 삭제</button>
        <span class="spacer"></span>
        <span class="ed-dirty" id="doc-dirty" ${dirty ? '' : 'hidden'}>저장 안 된 변경 있음</span>
        <button type="button" class="btn primary" onclick="saveDocTemplates()"><i class="ti ti-device-floppy"></i>문서 양식 저장</button></div>
    </section>` : `<section class="set-sec doc-edit"><div class="empty">문서 양식이 없습니다. 왼쪽 [문서 양식 추가]로 만들어 주세요.</div>
      ${dirty ? '<div class="set-save"><span class="spacer"></span><span class="ed-dirty">저장 안 된 변경 있음</span><button type="button" class="btn primary" onclick="saveDocTemplates()"><i class="ti ti-device-floppy"></i>문서 양식 저장</button></div>' : ''}</section>`}
  </div>`;
}
// 이 양식이 연결된 업무 단계 (저장된 플로우 기준)
function docUsage(k) {
  return ['print', 'banner', 'printMonthly'].flatMap(type => flowOf(type).filter(s => stepDoc(type, s) === k).map(s => `${JOB_TYPES[type]} › ${s.t}`));
}
function mountDocEditor() { /* 자리 표시 */ }
function switchDocTpl(k) { ui.settings.doc = k; renderSettings(); }
function markDocDirty() { const el = $('#doc-dirty'); if (el) el.hidden = false; }
function renameDocTpl(k, v) {
  const d = ui.settings.docListDraft.find(x => x.k === k);
  d.name = v;
  const nm = document.querySelector(`.doc-nav [data-k="${k}"] .nm`);
  if (nm) nm.textContent = v.trim() || '(제목 없음)';
  markDocDirty();
}
function addDocTpl() {
  const k = 'd' + Date.now().toString(36);
  ui.settings.docListDraft.push({ k, name: '새 문서 양식' });
  ui.settings.docDraft = Object.assign(ui.settings.docDraft || {}, { [k]: '' });
  ui.settings.doc = k;
  renderSettings();
  const el = $('#ws-doc-name'); if (el) { el.focus(); el.select(); }
}
function moveDocTpl(k, d) {
  const a = ui.settings.docListDraft, i = a.findIndex(x => x.k === k);
  [a[i], a[i + d]] = [a[i + d], a[i]];
  renderSettings();
}
async function removeDocTpl(k) {
  const d = ui.settings.docListDraft.find(x => x.k === k), used = docUsage(k);
  const ok = await confirmBox('문서 양식 삭제', `<b>${esc(d.name || '(제목 없음)')}</b> 양식을 삭제합니다.${used.length ? `<br><br>연결된 업무 단계 ${used.length}곳(${used.map(esc).join(', ')})의 문구 생성 연결도 함께 해제됩니다.` : ''}<br>[문서 양식 저장]을 눌러야 실제로 반영됩니다.`, '삭제');
  if (!ok) return renderSettings();
  ui.settings.docListDraft = ui.settings.docListDraft.filter(x => x.k !== k);
  if (ui.settings.docDraft) delete ui.settings.docDraft[k];
  ui.settings.doc = (ui.settings.docListDraft[0] || {}).k;
  renderSettings();
}
function insertDocVar(v) {
  const ta = $('#ws-doc'), s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.slice(0, s) + v + ta.value.slice(e);
  ta.focus(); ta.setSelectionRange(s + v.length, s + v.length);
  ta.dispatchEvent(new Event('input'));
}
async function saveDocTemplates() {
  const w = workSettings(), list = (ui.settings.docListDraft || docList(w)).map(d => ({ k: d.k, name: String(d.name || '').trim() }));
  const blank = list.find(d => !d.name);
  if (blank) { ui.settings.doc = blank.k; renderSettings(); return toast('문서 제목을 입력해 주세요.', true); }
  const drafts = ui.settings.docDraft || {}, docs = {};
  list.forEach(d => { docs[d.k] = drafts[d.k] !== undefined ? drafts[d.k] : (w.docs[d.k] || ''); });
  // 삭제된 양식이 연결된 단계는 연결 해제 (기본 플로우를 쓰는 업무도 현재 단계로 저장해 둠)
  const keys = new Set(list.map(d => d.k)), flows = Object.assign({}, w.flows);
  ['print', 'banner', 'printMonthly'].forEach(type => {
    const steps = flowDraftOf(type);
    if (steps.some(s => s.doc && !keys.has(s.doc))) flows[type] = steps.map(s => Object.assign(s, { doc: keys.has(s.doc) ? s.doc : '' }));
  });
  busy(true);
  try {
    await api('saveSettings', { workSettings: Object.assign({}, w, { docs, docList: list, flows }) });
    ui.settings.docDraft = {}; ui.settings.docListDraft = null; ui.settings.flowDraft = {};
    await refreshAll(); toast('문서 양식을 저장했습니다.');
  } catch (err) { toast(err.message, true); } finally { busy(false); }
}

async function changeCode(e) {
  e.preventDefault();
  const cur = $('#cc-cur').value, n1 = $('#cc-new').value, n2 = $('#cc-new2').value;
  if (n1 !== n2) return toast('새 접속 코드가 서로 다릅니다.', true);
  if (n1 === cur) return toast('현재 코드와 다른 코드를 입력해 주세요.', true);
  if (n1.length < 6 || !/[A-Za-z]/.test(n1) || !/[0-9]/.test(n1)) return toast('6자 이상, 영문과 숫자를 모두 포함해 주세요.', true);
  busy(true);
  try { await api('changeCode', { current: cur, next: n1 }); await refreshAll(); toast('접속 코드를 변경했습니다. 다음 로그인부터 새 코드를 사용하세요.'); }
  catch (err) { toast(err.message, true); } finally { busy(false); }
}
async function setAccepting(on) {

  busy(true);
  try {
    await api('setAccepting', { value: on });
    if (ui.catalog.draft) { ui.catalog.draft.content.acceptingOrders = on ? 'Y' : 'N'; const b = JSON.parse(ui.catalog.base); b.content.acceptingOrders = on ? 'Y' : 'N'; ui.catalog.base = JSON.stringify(b); }
    await refreshAll(); toast(on ? '신청 접수를 다시 시작했습니다.' : '신청 접수를 중지했습니다.');
    if (ui.catalog.draft) ui.catalog.baseVersion = DB.content.catalogVersion;
  } catch (e) { toast(e.message, true); } finally { busy(false); }
}

    createBatch: d => {
      const c = d.category, bad = db.orders.filter(o => d.orderIds.includes(o.orderId) && (o.status === '취소' || o[field(c)]));
      if (bad.length) fail('이미 취합되었거나 취소된 건이 포함되어 있습니다. 새로고침해 주세요.');
      const batchId = makeBatch(c, d.orderIds, d.memo || '', new Date(), false);
      db.jobs.push(buildJob(c, ymd(new Date()), batchId));
      return { batchId };
    },
    cancelCollect: d => {
      const f = field(d.category), touched = new Set();
      db.orders.forEach(o => { if (d.orderIds.includes(o.orderId) && o[f]) { touched.add(o[f]); o[f] = ''; } });
      if (!touched.size) fail('취합 취소할 수 있는 건이 없습니다.');
      db.batches = db.batches.filter(bt => {
        if (!touched.has(bt.batchId)) return true;
        bt.orderIds = bt.orderIds.filter(id => !d.orderIds.includes(id));
        if (!bt.orderIds.length) { db.stockLog = db.stockLog.filter(l => !(l.type === 'OUT' && l.refId === bt.batchId)); db.jobs = db.jobs.filter(j => j.batchId !== bt.batchId); return false; }
        bt.summary = summarize(bt.orderIds, bt.category); stockOut(bt); return true;
      });
      return {};
    },
    markOrdered: d => { const b = db.batches.find(x => x.batchId === d.batchId); b.orderedAt = d.ordered ? iso(new Date()) : ''; b.status = d.ordered ? '발주완료' : '파일생성'; return {}; },
    saveMonthlyIn: d => { db.stockLog = db.stockLog.filter(l => !(l.type === 'IN' && l.month === d.month));
      d.entries.filter(e => e.qty > 0).forEach(e => db.stockLog.push({ logId: uid('L'), date: iso(new Date()), month: d.month, itemId: e.itemId, type: 'IN', qty: e.qty, refId: '', memo: e.memo || '월 발주 입고' })); return {}; },
    addStockIn: d => { d.entries.filter(e => e.qty > 0).forEach(e => db.stockLog.push({ logId: uid('L'), date: d.date + 'T09:00:00', month: d.date.slice(0, 7), itemId: e.itemId, type: 'IN', qty: e.qty, refId: '', memo: d.memo || '발주 입고' })); return {}; },
    addAdjusts: d => { d.entries.filter(e => e.qty).forEach(e => db.stockLog.push({ logId: uid('L'), date: d.date + 'T09:00:00', month: d.date.slice(0, 7), itemId: e.itemId, type: 'ADJ', qty: e.qty, refId: '', memo: e.memo || d.memo })); return {}; },
    addAdjust: d => { db.stockLog.push({ logId: uid('L'), date: iso(new Date()), month: d.month, itemId: d.itemId, type: 'ADJ', qty: d.qty, refId: '', memo: d.memo }); return {}; },
    deleteLog: d => { db.stockLog = db.stockLog.filter(l => l.logId !== d.logId); return {}; },
    addDraft: d => { db.drafts.push({ draftId: uid('D'), itemId: d.itemId, title: d.title, version: d.version, fileId: d.fileId || '', fileName: d.fileName || '', mimeType: d.mimeType || '', url: d.fileId ? '' : d.url || '', size: d.size || 0, memo: d.memo, uploadedAt: iso(new Date()) }); return {}; },
    deleteDraft: d => { db.drafts = db.drafts.filter(x => x.draftId !== d.draftId); return {}; },
    downloadFile: d => files[d.fileId] ? { name: files[d.fileId].name, mimeType: files[d.fileId].mimeType, data: files[d.fileId].base64 } : fail('데모 모드에서는 새로고침 전에 올린 파일만 받을 수 있습니다.')
  };
  return {
    call: async (action, data) => {
      if (!db) load();
      await new Promise(r => setTimeout(r, 120));
      if (!A[action]) fail('알 수 없는 요청: ' + action);
      const r = A[action](data || {});
      persist();
      return Object.assign({ ok: true }, r);
    },
    reset: () => { try { localStorage.removeItem(KEY); } catch (e) {} db = null; }
  };
})();
async function resetDemo() {
  if (!(await confirmBox('샘플 데이터 초기화', '데모 데이터를 처음 상태로 되돌릴까요?', '초기화', true))) return;
  Mock.reset(); ui.catalog.draft = null; ui.stats.picked = null;
  if (TOKEN) { await refreshAll(); toast('샘플 데이터를 초기화했습니다.'); }
}
