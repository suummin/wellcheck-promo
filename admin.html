<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>웰체크 홍보물 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
:root{
  --brand:#185FA5;--brand-dark:#0C447C;--brand-soft:#EFF6FF;--brand-line:#BFDBFE;
  --ink:#111827;--ink-2:#374151;--ink-3:#6B7280;--ink-4:#9CA3AF;
  --line:#E5E7EB;--bg:#E8EFF8;--surface:#fff;--surface-2:#F9FAFB;
  --ok:#166534;--ok-bg:#DCFCE7;--warn:#92400E;--warn-bg:#FEF3C7;--bad:#991B1B;--bad-bg:#FEE2E2;
  --s-print:#2a78d6;--s-banner:#eb6834;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
a{color:var(--brand)}
.hidden{display:none!important}

/* ── 로그인 ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{background:#fff;width:100%;max-width:380px;border-radius:18px;box-shadow:0 2px 6px rgba(0,0,0,.07),0 12px 40px rgba(0,0,0,.07);overflow:hidden}
.login-head{background:linear-gradient(135deg,#D6E8FF 0%,#BDD4FF 100%);padding:28px 24px;display:flex;gap:14px;align-items:center}
.login-head img{width:52px;height:52px;border-radius:14px}
.login-head h1{font-size:20px;font-weight:900;color:#1A3360}
.login-head p{font-size:12px;color:#3B5E8C;margin-top:4px}
.login-body{padding:24px}
.login-body label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;color:var(--ink-2)}
.pw-wrap{position:relative}
.pw-wrap input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 44px 0 14px;font-size:16px}
.pw-wrap input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(24,95,165,.12)}
.pw-eye{position:absolute;right:8px;top:8px;width:30px;height:30px;border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:18px}
.login-err{color:#DC2626;font-size:12px;margin-top:8px;min-height:16px}
.login-hint{font-size:12px;color:var(--ink-3);margin-top:14px;line-height:1.6}

/* ── 레이아웃 ── */
.app{display:flex;min-height:100vh}
.side{width:220px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-brand{display:flex;gap:10px;align-items:center;padding:18px 16px;border-bottom:1px solid var(--line)}
.side-brand img{width:36px;height:36px;border-radius:10px}
.side-brand b{font-size:14px;color:#1A3360;display:block}
.side-brand span{font-size:11px;color:var(--ink-3)}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;padding:10px 12px;border-radius:9px;color:var(--ink-2);font-weight:600;cursor:pointer;text-align:left;white-space:nowrap}
.nav button i{font-size:18px;color:var(--ink-3)}
.nav button:hover{background:var(--brand-soft)}
.nav button.active{background:var(--brand);color:#fff}
.nav button.active i{color:#fff}
.nav .nav-badge{margin-left:auto;background:#DC2626;color:#fff;font-size:11px;border-radius:20px;padding:1px 7px}
.nav button.active .nav-badge{background:#fff;color:var(--brand)}
.side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
.side-foot button{margin-top:8px;width:100%}
.main{flex:1;min-width:0;padding:24px 28px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:22px;font-weight:800;color:#1A3360;letter-spacing:-.3px}
.page-head p{font-size:13px;color:var(--ink-3);margin-top:4px}
.demo-bar{background:#1A3360;color:#fff;font-size:12px;padding:8px 16px;text-align:center}
.demo-bar button{margin-left:8px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px}

/* ── 공통 컴포넌트 ── */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-title .sub{font-size:12px;font-weight:500;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink-2);font-weight:600;cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{background:#F3F4F6}
.btn i{font-size:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.danger{color:#B91C1C;border-color:#FCA5A5}
.btn.danger:hover{background:#FEF2F2}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .spacer{flex:1}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:12px;font-weight:700;color:var(--ink-2)}
.field .help{font-size:11px;color:var(--ink-3);line-height:1.5}
.inp,.sel,.ta{height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#fff;color:var(--ink);min-width:0}
.ta{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(24,95,165,.1)}
.inp.num{width:90px;text-align:right}
.seg{display:inline-flex;background:#F1F5F9;border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--ink-3);cursor:pointer;font-size:13px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.chip.banner{background:#E3EEFB;color:#1D5BA8}
.chip.print{background:#FDEBE3;color:#B4461A}
.chip.st-접수{background:var(--warn-bg);color:var(--warn)}
.chip.st-취합완료{background:var(--ok-bg);color:var(--ok)}
.chip.st-취소{background:#F3F4F6;color:var(--ink-3)}
.chip.st-파일생성{background:#E0E7FF;color:#3730A3}
.chip.st-발주완료{background:var(--ok-bg);color:var(--ok)}
.chip.gray{background:#F3F4F6;color:var(--ink-3)}
.chip.red{background:var(--bad-bg);color:var(--bad)}
.chip.amber{background:var(--warn-bg);color:var(--warn)}
.chip.green{background:var(--ok-bg);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .k-label{font-size:12px;color:var(--ink-3);font-weight:600}
.kpi .k-val{font-size:24px;font-weight:800;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .k-val small{font-size:13px;font-weight:600;color:var(--ink-3);margin-left:2px}
.kpi.alert .k-val{color:#B91C1C}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#F8FAFC;color:var(--ink-3);font-weight:700;font-size:12px;text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:10px;border-bottom:1px solid #F1F5F9;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#F8FBFF}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.nowrap{white-space:nowrap}
.tbl tfoot td{background:#F8FAFC;font-weight:800}
.tbl .neg{color:#B91C1C;font-weight:700}
.items-cell{display:flex;flex-direction:column;gap:2px;min-width:180px}
.items-cell span{white-space:nowrap}
.empty{padding:36px 16px;text-align:center;color:var(--ink-3);font-size:13px}
.empty i{font-size:28px;display:block;margin-bottom:6px;color:var(--ink-4)}
.note{display:flex;gap:8px;align-items:flex-start;background:#F8FAFF;border:1px solid #93C5FD;border-radius:9px;padding:10px 12px;font-size:12px;color:#3B5E8C;line-height:1.6;margin-bottom:12px}
.note.warn{background:#FFFBEB;border-color:#FCD34D;color:#92400E}
.note.bad{background:#FEF2F2;border-color:#FCA5A5;color:#991B1B}
.note i{font-size:16px;flex-shrink:0;margin-top:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.more-btn{display:block;margin:12px auto 0}

/* ── 모달 / 드로어 / 토스트 ── */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:900;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:16px}
.modal-b{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x-btn{border:none;background:none;font-size:20px;color:var(--ink-3);cursor:pointer;width:32px;height:32px;border-radius:8px}
.x-btn:hover{background:#F3F4F6}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{color:var(--ink);word-break:break-all}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;background:#fff;z-index:800;box-shadow:-10px 0 40px rgba(0,0,0,.15);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .2s}
.drawer.open{transform:none}
.drawer .grid2>*,.drawer .row>.field{min-width:0}
.drawer .grid2 .inp,.drawer .grid2 .sel{width:100%}
.img-edit>div{min-width:0}
.img-edit .inp{width:100%}
.cat-toolbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;box-shadow:0 8px 8px -8px rgba(15,23,42,.12)}
#ed-grid .item-card{scroll-margin-top:90px}
@media (min-width: 901px){ body.drawer-open .main{padding-right:448px;transition:padding-right .2s} }
@media (min-width: 901px) and (max-width: 1100px){
  .drawer{width:360px}
  body.drawer-open .main{padding-right:376px}
  body.drawer-open .wc{padding:8px}
  body.drawer-open .wc .inner{padding:1rem}
  body.drawer-open .wc .top-header{padding:1rem}
  body.drawer-open .wc .items-grid{grid-template-columns:1fr}
}
.drawer .modal-b{flex:1}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#166534;color:#DCFCE7;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:1000;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.toast.show{opacity:1}
.toast.error{background:#991B1B;color:#FEE2E2}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:950;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--ink-2);font-weight:600}
.spinner{width:32px;height:32px;border:3px solid #E5E7EB;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.switch input{display:none}
.switch .track{width:38px;height:22px;background:#D1D5DB;border-radius:20px;position:relative;transition:background .15s;flex-shrink:0}
.switch .track::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .15s}
.switch input:checked+.track{background:var(--brand)}
.switch input:checked+.track::after{left:19px}

/* ── 신청 내역 · 취합 ── */
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap}
.cat-tabs button{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border:1px solid var(--line);border-bottom:none;border-radius:12px 12px 0 0;background:#F1F5F9;color:var(--ink-3);font-weight:700;font-size:15px;cursor:pointer}
.cat-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 -2px 0 var(--brand) inset}
.cat-tabs button:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.cat-tabs .dot{width:10px;height:10px;border-radius:3px}
.todo-badge{font-size:11px;font-weight:700;background:var(--warn-bg);color:var(--warn);border-radius:20px;padding:2px 8px}
.cat-card-main{border-top-left-radius:0}
.action-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;margin-bottom:10px;background:var(--surface-2)}
.action-bar.active{border-style:solid;border-color:var(--brand-line);background:var(--brand-soft)}
.action-bar .sel-count{font-size:13px;color:var(--ink-2)}
.action-bar .spacer{flex:1}
.tbl th.chk,.tbl td.chk{width:36px;text-align:center;padding-left:12px;padding-right:4px}
.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.tbl tr.is-sel td{background:#EFF6FF}
.tbl tr.muted td{color:var(--ink-4)}
.also{font-size:11px;color:var(--ink-3);margin-top:2px}
.sub-line{font-size:11px;color:var(--ink-3);margin-top:2px}
table.xl{border-collapse:collapse;font-size:12px;width:100%}
table.xl th,table.xl td{border:1px solid #B7B7B7;padding:6px 8px}
table.xl th{background:#EEECE1;font-weight:700;text-align:center;white-space:nowrap}
table.xl th.it{white-space:normal;min-width:96px}
table.xl th small{display:block;font-weight:400;color:var(--ink-3)}
table.xl tbody tr:nth-child(even) td{background:#F8F9FA}
table.xl td.c{text-align:center;white-space:nowrap}
table.xl td.addr{min-width:280px}
table.xl td.r{text-align:right}
table.xl tfoot td{background:#F2F2F2;font-weight:700}

/* ── 재고 변동 이력 표 ── */
.month-label{font-size:14px;min-width:92px;text-align:center;font-variant-numeric:tabular-nums}
.pivot-wrap{max-height:none}
.tbl.pivot th,.tbl.pivot td{white-space:nowrap}
.tbl.pivot .pv-item{position:sticky;left:0;background:#fff;z-index:1;min-width:200px;box-shadow:1px 0 0 var(--line)}
.tbl.pivot thead .pv-item{background:#F8FAFC;z-index:2}
.tbl.pivot tfoot .pv-item{background:#F8FAFC}
.tbl.pivot .pv-date small{display:block;font-size:10px;font-weight:600;color:var(--ink-4)}
.tbl.pivot .pv-sum{background:#F8FAFC;border-left:1px solid var(--line)}
.pv-cell{border:none;background:none;font:inherit;font-variant-numeric:tabular-nums;color:var(--brand);font-weight:700;cursor:pointer;padding:2px 6px;border-radius:6px;position:relative}
.pv-cell:hover{background:var(--brand-soft)}
.pv-cell.has-adj::after,.adj-dot{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#B45309;vertical-align:top;margin-left:2px}
.pv-empty{color:#D1D5DB}

/* ── 업무 일정 ── */
.kpi.warnk .k-val{color:var(--warn)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:12px;font-weight:700;color:var(--ink-3);text-align:center;padding:4px 0}
.cal-d{min-height:96px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;font:inherit;min-width:0}
.cal-d:hover{border-color:var(--brand-line);background:#FAFCFF}
.cal-d.out{background:#F8FAFC;opacity:.55}
.cal-d.today{border:2px solid var(--brand)}
.cal-d.picked{box-shadow:0 0 0 3px rgba(24,95,165,.25)}
.cal-n{font-size:12px;font-weight:800;color:var(--ink-2);display:flex;align-items:center;gap:4px;width:100%}
.cal-late{background:#DC2626;color:#fff;border-radius:20px;font-size:10px;padding:0 6px}
.cal-chip{font-size:11px;line-height:1.3;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--s-print);background:#EEF4FC;color:var(--ink-2)}
.cal-chip.banner{border-left-color:var(--s-banner);background:#FDF0EA}
.cal-chip.done{opacity:.55;text-decoration:line-through}
.cal-chip.late{background:var(--bad-bg);color:var(--bad);font-weight:700}
.cal-more{font-size:11px;color:var(--ink-3)}
.legend .lg-done{background:#CBD5E1}
.legend .lg-late{background:#DC2626}
.wk-list{display:flex;flex-direction:column;gap:12px}
.wk-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.wk-card.complete{background:#FAFCFB;opacity:.8}
.wk-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.wk-head .spacer{flex:1}
.wk-prog{width:90px;height:6px;border-radius:6px;background:#E5E7EB;overflow:hidden;display:inline-block}
.wk-prog span{display:block;height:100%;background:var(--ok)}
.wk-cnt{font-size:12px;font-variant-numeric:tabular-nums}
.wk-steps{list-style:none;display:flex;flex-direction:column}
.wk-step{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-top:1px solid #F1F5F9}
.wk-step.focus{background:#FFFBEB;border-radius:8px}
.wk-step.done .wk-t{color:var(--ink-3);text-decoration:line-through}
.wk-step.done .wk-t .chip{text-decoration:none}
.wk-chk input{width:18px;height:18px;accent-color:var(--ok);margin-top:2px;cursor:pointer}
.wk-chk input:disabled{cursor:default}
.wk-main{flex:1;min-width:0}
.wk-t{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wk-act{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.wk-note{font-size:12px;color:var(--ink-2);background:#F8FAFC;border-radius:6px;padding:4px 8px;margin-top:4px;display:flex;gap:4px;align-items:flex-start}
.wk-warn{margin:6px 0 0}
.doc-ta{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Malgun Gothic',monospace;font-size:13px;line-height:1.6}
@media (max-width: 900px){
  .cal-d{min-height:64px;padding:4px}
  .cal-chip{font-size:0;padding:0;height:6px;border-left-width:0;background:var(--s-print)}
  .cal-chip.banner{background:var(--s-banner)}
  .cal-chip.done{background:#CBD5E1;text-decoration:none}
  .cal-chip.late{background:#DC2626}
  .wk-step{flex-wrap:wrap}
  .wk-act{width:100%;justify-content:flex-start;padding-left:28px}
}

/* ── 설정 탭 ── */
.set-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.set-tabs button{display:inline-flex;align-items:center;gap:6px;border:none;background:none;padding:10px 16px;font-weight:700;font-size:14px;color:var(--ink-3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.set-tabs button i{font-size:17px}
.set-tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.set-tabs button:hover{color:var(--ink)}
.set-body{display:flex;flex-direction:column;gap:14px}
.set-body>form{display:flex;flex-direction:column;gap:14px}
.set-sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.set-sec h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.set-sec h3 i{color:var(--brand);font-size:18px}
.set-sec .help{font-size:12px;color:var(--ink-3);line-height:1.6;margin-top:6px}
.set-row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.set-row>div:first-child{flex:1;min-width:220px}
.set-side{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.set-save{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.set-save .spacer{flex:1}
.vendor-box{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.off-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.off-chip{display:inline-flex;align-items:center;gap:6px;background:var(--warn-bg);color:var(--warn);border-radius:20px;padding:4px 6px 4px 12px;font-size:12px;font-weight:700}
.off-chip.past{opacity:.5}
.off-chip button{border:none;background:none;color:inherit;cursor:pointer;width:20px;height:20px;border-radius:50%}
.off-chip button:hover{background:rgba(0,0,0,.08)}
.doc-layout{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start}
.doc-nav{display:flex;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}
.doc-nav button{display:flex;align-items:center;gap:8px;border:none;background:none;padding:10px 12px;border-radius:9px;font-weight:600;color:var(--ink-2);cursor:pointer;text-align:left}
.doc-nav button.on{background:var(--brand-soft);color:var(--brand)}
.dot-chg{width:7px;height:7px;border-radius:50%;background:#D97706;margin-left:auto}
.doc-edit{display:flex;flex-direction:column;gap:10px}
.var-chips{display:flex;gap:4px;flex-wrap:wrap}
.var-chips button{border:1px solid var(--brand-line);background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;font-family:ui-monospace,Menlo,Consolas,monospace}
.var-chips button:hover{background:#DBEAFE}
.nav .nav-badge.soft{background:var(--brand-soft);color:var(--brand)}
.nav button.active .nav-badge.soft{background:#fff}
.cal-d.off{background:#FFFBEB}
.cal-d.off.out{background:#F8FAFC}
.cal-off{font-size:10px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}
.legend .lg-off{background:#FDE68A}
.cal-chip.etc{border-left-color:#6B7280;background:#F3F4F6}
.cal-chip.start{font-weight:700}
.cal-st{font-size:12px;line-height:1;margin-left:auto}
.cal-d.pending{background:#FFFBEB;border-color:#FCD34D}
.cal-d.pending.out{background:#FFFDF5}
.cal-d.picked{box-shadow:0 0 0 3px rgba(24,95,165,.35);border-color:var(--brand)}
.pending-pill{border:1px solid #FCD34D;background:#FFFBEB;color:#92400E;font-weight:700;font-size:12px;border-radius:20px;padding:3px 10px;cursor:pointer}
.pending-pill:hover{background:#FEF3C7}
.day-st{font-size:12px;font-weight:700;border-radius:20px;padding:2px 10px}
.day-st.pending{background:#FFFBEB;color:#92400E}
.day-st.clear{background:var(--ok-bg);color:var(--ok)}
.wk-sub{font-size:13px;font-weight:800;color:var(--ink-2);margin:4px 0 8px;display:flex;gap:6px;align-items:center}
.wk-sub .sub{font-size:12px;font-weight:500;color:var(--ink-3)}
.wk-list+.wk-sub{margin-top:16px}
.cal-chip.done{opacity:.6}
.legend .lg-start{background:#93C5FD}
.wk-step.next{background:#F8FBFF;border-radius:8px}
.chip.next-chip{background:var(--brand);color:#fff}
.flow-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.flow-list li{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff}
.flow-list .inp{flex:1;min-width:0}
.flow-no{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.flow-plain{opacity:.6}
.flow-doc{width:200px;flex-shrink:0;height:34px;font-size:12px;color:var(--ink-3)}
.flow-doc.on{color:var(--brand);font-weight:700;border-color:#93C5FD;background:#F8FBFF}
.doc-add{display:flex;align-items:center;gap:6px;border:1px dashed var(--line);background:none;padding:9px 12px;border-radius:9px;font-weight:700;color:var(--brand);cursor:pointer;margin-top:4px}
.doc-add:hover{background:var(--brand-soft)}
.doc-nav .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-pick{display:flex;flex-direction:column;gap:6px}
.box-rules{display:flex;flex-direction:column;gap:6px;max-width:560px}
.box-rule{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff}
.box-rule .nm{flex:1;min-width:0;font-weight:600}
.box-rule .inp{width:80px}
.doc-pick .btn{justify-content:flex-start}
@media (max-width: 700px){ .flow-list li{flex-wrap:wrap} .flow-list .inp{flex-basis:calc(100% - 32px)} .flow-doc{flex:1;width:auto} }
.doc-nav .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.wk-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
@media (max-width: 900px){ .doc-layout{grid-template-columns:1fr} .doc-nav{flex-direction:row;overflow-x:auto} .doc-nav button{white-space:nowrap} .cal-off{font-size:0;padding:0;width:6px;height:6px;border-radius:50%;background:var(--warn)} }

/* ── 페이지네이션 ── */
.pager{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:12px}
.pager .pg{min-width:32px;height:32px;padding:0 8px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--ink-2);font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.pager .pg:hover:not(:disabled){background:var(--brand-soft)}
.pager .pg.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pager .pg:disabled{opacity:.35;cursor:default}
.pager .pg i{font-size:14px}
.pager .pg-gap{color:var(--ink-4);padding:0 2px}
.pager .pg-info{font-size:12px;color:var(--ink-3);margin-left:8px}
.sel-hint{font-size:12px;color:var(--ink-2);background:#F8FAFC;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:10px;text-align:center}

/* ── 취합 (이전) ── */
.cat-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.cat-card h4{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cat-card .dot{width:10px;height:10px;border-radius:3px}
.cat-card .cnt{font-size:12px;color:var(--ink-3);margin-bottom:8px}
.mini-tbl{width:100%;font-size:12px;border-collapse:collapse}
.mini-tbl td,.mini-tbl th{padding:5px 4px;border-bottom:1px solid #F1F5F9;text-align:left}
.mini-tbl th{color:var(--ink-3);font-weight:600}
.mini-tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── 홍보물 편집: 신청 페이지와 동일한 카드 스타일 (apply.html과 같은 값) ── */
.ed-layout{display:flex;gap:16px;align-items:flex-start}
.ed-stage{flex:1;min-width:0}
.ed-dirty{font-size:12px;font-weight:700;color:#B45309;background:var(--warn-bg);padding:4px 10px;border-radius:20px}
.wc{background:#E8EFF8;border-radius:16px;padding:18px}
.wc .page{background:#fff;max-width:1000px;margin:0 auto;border-radius:18px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.07),0 12px 40px rgba(0,0,0,.07)}
.wc .top-header{display:flex;align-items:center;gap:18px;padding:2rem 2.5rem;background:linear-gradient(135deg,#D6E8FF 0%,#BDD4FF 100%);border-bottom:1px solid #AECBF5}
.wc .logo-img{width:58px;height:58px;border-radius:15px;object-fit:cover;flex-shrink:0;box-shadow:0 4px 14px rgba(37,99,235,.3)}
.wc .header-text h1{font-size:25px;font-weight:900;color:#1A3360;letter-spacing:-.5px}
.wc .header-text p{font-size:14px;color:#3B5E8C;margin-top:5px}
.wc .inner{padding:1.5rem 2rem 2.5rem}
.wc .notice-box{display:flex;gap:12px;align-items:flex-start;background:#FFF3CD;border:2px solid #F59E0B;border-radius:12px;padding:16px 20px;margin-bottom:1.75rem}
.wc .notice-icon{font-size:22px;flex-shrink:0}
.wc .notice-label{font-size:13px;font-weight:800;color:#92400E;margin-bottom:4px}
.wc .notice-text{font-size:13px;color:#78350F;line-height:1.6}
.wc .notice-text strong{font-weight:800;color:#B45309}
.wc .section-title{font-size:15px;font-weight:700;color:#374151;margin-bottom:1rem}
.wc .tab-bar{display:flex;border-bottom:1px solid #E5E7EB;margin-bottom:1.25rem;gap:6px}
.wc .tab-btn{position:relative;padding:11px 22px;font-size:15px;font-weight:600;color:#6B7280;background:#F1F5F9;border:none;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}
.wc .tab-btn.active{color:#fff;font-weight:700;background:#185FA5}
.wc .tab-badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;margin-left:5px;background:#F3F4F6;color:#6B7280;font-weight:500}
.wc .tab-btn.active .tab-badge{background:rgba(255,255,255,.25);color:#fff}
.wc .sales-notice{display:flex;gap:8px;align-items:flex-start;background:#F8FAFF;border:1.5px solid #93C5FD;border-radius:8px;padding:10px 14px;margin-bottom:1.25rem;font-size:13px;color:#3B5E8C}
.wc .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:1rem}
.wc .item-card{background:#fff;border:1px solid #E5E7EB;border-radius:14px;padding:2.5rem 1rem 1rem;position:relative;cursor:grab;transition:box-shadow .15s,border-color .15s}
.wc .item-card:hover{border-color:#93C5FD;box-shadow:0 2px 14px rgba(24,95,165,.12)}
.wc .item-card.is-sel{border:2px solid #185FA5;background:#EFF6FF}
.wc .item-card.off{opacity:.5}
.wc .item-card.sortable-ghost{opacity:.3}
.wc .item-card.sortable-chosen{box-shadow:0 10px 30px rgba(24,95,165,.25)}
.wc .item-img{width:100%;height:240px;background:#F3F7FF;border-radius:10px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.wc .item-img img{width:100%;height:100%;object-fit:contain;border-radius:10px;display:block;pointer-events:none}
.wc .img-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;color:#9CA3AF;font-size:13px}
.wc .item-name{font-size:13px;font-weight:700;color:#111827;margin-bottom:3px;line-height:1.4}
.wc .item-unit{font-size:12px;color:#6B7280;margin-bottom:6px}
.wc .item-unit-special{font-size:12px;font-weight:700;color:#185FA5;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:5px;padding:2px 8px;display:inline-block;margin-bottom:6px}
.wc .card-actions{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.wc .qty-row{display:flex;align-items:center;gap:6px}
.wc .qty-btn{width:30px;height:30px;border:1px solid #D1D5DB;border-radius:8px;background:#fff;color:#374151;font-size:18px;display:flex;align-items:center;justify-content:center}
.wc .qty-display{font-size:15px;font-weight:700;min-width:26px;text-align:center}
.wc .qty-label{font-size:12px;color:#6B7280}
.wc .pdf-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#185FA5;border:1px solid #BFDBFE;border-radius:8px;padding:5px 10px;background:#EFF6FF;text-decoration:none}
.wc .pdf-btn.none{color:#9CA3AF;border-color:#E5E7EB;background:#F9FAFB}
.wc .checkbox-wrap{position:absolute;top:10px;left:10px;width:22px;height:22px;border:1.5px solid #D1D5DB;border-radius:5px;background:#fff}
.wc .delivery-box{background:#F0F7FF;border:1px solid #BFDBFE;border-radius:10px;padding:14px 18px;margin-top:1rem}
.wc .delivery-title{font-size:14px;font-weight:700;color:#1E40AF;margin-bottom:8px}
.wc .delivery-list{padding-left:16px;display:flex;flex-direction:column;gap:5px}
.wc .delivery-list li{font-size:13px;color:#374151;line-height:1.6}
.wc .delivery-list li strong{color:#1E40AF}
.wc .editable{position:relative;cursor:pointer;border-radius:8px;outline:2px dashed transparent;outline-offset:4px;transition:outline-color .15s}
.wc .editable:hover{outline-color:#93C5FD}
.wc .edit-pill{position:absolute;top:-10px;right:-6px;background:#1A3360;color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:2px 8px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:2}
.wc .editable:hover>.edit-pill{opacity:1}
.wc .sec-hl{outline:3px solid #3B82F6 !important;outline-offset:4px;box-shadow:0 0 0 9px rgba(59,130,246,.12);animation:secPulse 1.2s ease-out 1}
@keyframes secPulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,.45)}100%{box-shadow:0 0 0 9px rgba(59,130,246,.12)}}
.wc .ed-video{border:1px solid #C9CDD4;border-radius:12px;margin-top:1.75rem}
.wc .ed-video.empty{opacity:.6}
.wc .ed-video-h{display:flex;align-items:center;gap:8px;padding:14px 18px;background:#F3F4F6;font-size:14px;font-weight:700;color:#374151;border-radius:12px 12px 0 0}
.wc .ed-video-b{padding:12px 18px;background:#F9FAFB;border-top:1px solid #C9CDD4;border-radius:0 0 12px 12px;font-size:12px;color:#374151;display:flex;flex-direction:column;gap:8px}
.wc .ed-video-i{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;border:1px solid #E5E7EB;border-radius:9px;font-size:13px;font-weight:600}
.wc .ed-video-i i{color:#185FA5}
.wc .ed-video-none{color:#6B7280}
.card-flags{position:absolute;top:8px;right:10px;display:flex;gap:4px}
.card-order{position:absolute;top:10px;left:40px;font-size:11px;font-weight:800;color:#9CA3AF}
.drag-hint{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.add-card{border:2px dashed #BFDBFE;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--brand);font-weight:700;min-height:200px;cursor:pointer;background:#F8FBFF}
.add-card:hover{background:#EFF6FF}
.preview-frame{width:100%;border:none;border-radius:16px;background:#E8EFF8;height:900px;display:block}
.device-seg{margin-left:auto}
.img-edit{display:flex;gap:10px;align-items:center}
.img-edit .thumb{width:84px;height:84px;border-radius:10px;background:#F3F7FF;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.img-edit .thumb img{width:100%;height:100%;object-fit:contain}
.video-row{display:grid;grid-template-columns:20px 1fr 1.4fr auto;gap:6px;align-items:center}
.video-row .handle{cursor:grab;color:var(--ink-4)}

.fs-xs{font-size:.75em}.fs-s{font-size:.85em}.fs-l{font-size:1.2em}.fs-xl{font-size:1.45em;line-height:1.35}.fs-xxl{font-size:1.7em;line-height:1.3}
.tab-edit{margin-left:8px;border:1px dashed #93C5FD;background:#F8FBFF;color:var(--brand);font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;cursor:pointer;vertical-align:middle}
.tab-edit:hover{background:var(--brand-soft)}
.sec-chips{display:flex;gap:6px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.sec-chips button{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer}
.sec-chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sec-chips button i{font-size:14px}
.rte{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.rte:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(24,95,165,.1)}
.rte-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.rte-btn{min-width:30px;height:28px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.rte-btn:hover{background:var(--brand-soft)}
.rte-size{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.rte-size button{width:28px;height:26px;border:none;background:#fff;cursor:pointer;font-size:15px;font-weight:700;color:var(--ink-2)}
.rte-size button:hover:not(:disabled){background:var(--brand-soft)}
.rte-size button:disabled{color:var(--ink-4);cursor:default}
.rte-size .rte-pct{width:auto;min-width:52px;padding:0 6px;font-size:12px;font-weight:700;border-left:1px solid var(--line);border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
.rte-area font[size="1"]{font-size:.75em}.rte-area font[size="2"]{font-size:.85em}.rte-area font[size="3"]{font-size:1em}.rte-area font[size="4"]{font-size:1.2em}.rte-area font[size="5"]{font-size:1.45em}.rte-area font[size="6"]{font-size:1.7em}
.rte-sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.rte-area{min-height:72px;padding:10px 12px;font-size:14px;line-height:1.6;outline:none}
.rte-area b{font-weight:800}
.rte+.help,.rte .help{display:block;padding:0 12px 8px;font-size:11px;color:var(--ink-3)}

/* ── 시안 ── */
.draft-group{margin-bottom:18px}
.draft-group h4{font-size:13px;font-weight:800;color:var(--ink-2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.draft-row{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.draft-ico{width:40px;height:40px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.draft-main{flex:1;min-width:0}
.draft-main b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.draft-main span{font-size:11px;color:var(--ink-3)}
.draft-main .memo{font-size:12px;color:var(--ink-2);margin-top:2px}
.draft-act{display:flex;gap:4px;flex-shrink:0}
.drop-zone{border:2px dashed var(--brand-line);border-radius:12px;padding:20px;text-align:center;color:var(--ink-3);background:#F8FBFF;cursor:pointer;font-size:13px}
.drop-zone.over{background:#E6F1FB;border-color:var(--brand)}

/* ── 통계 ── */
.chart-box{position:relative;height:300px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.item-picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.item-picker button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.item-picker button.on{border-color:var(--ink-2);font-weight:700}
.item-picker button .sw{width:16px;height:0;display:inline-block}
.kpi .k-sub{font-size:12px;color:var(--ink-3);margin-top:4px}
.delta{font-size:11px;font-weight:700;color:var(--ink-3)}
.delta.up{color:#1D6E3A}
.delta.down{color:#B91C1C}
.card-title .spacer{flex:1}

/* ── 모바일 ── */
@media (max-width: 900px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:sticky;top:0;z-index:700;border-right:none;border-bottom:1px solid var(--line)}
  .side-brand{padding:10px 16px}
  .side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;padding:6px 8px;gap:4px}
  .nav button{width:auto;padding:8px 12px}
  .main{padding:16px 16px 60px}
  .grid2,.cat-cards{grid-template-columns:1fr}
  .wc{padding:8px}
  .wc .top-header{padding:1.25rem 1rem}
  .wc .inner{padding:1rem}
  .wc .items-grid{grid-template-columns:1fr 1fr}
  .drawer{width:100vw}
  .cat-toolbar{position:static;box-shadow:none}
  .kv{grid-template-columns:90px 1fr}
  .cat-tabs{flex-wrap:nowrap}
  .cat-tabs button{flex:1;justify-content:center;padding:10px 8px;font-size:13px;flex-wrap:wrap;gap:4px}
}
@media (max-width: 600px){
  .wc .items-grid{grid-template-columns:1fr}
  .wc .header-text h1{font-size:20px}
  .page-head h2{font-size:19px}
  .side-brand{display:none}
}
</style>

   ════════════════════════════════════════════════════════════════ */
const API_URL = "https://script.google.com/macros/s/AKfycbwXs7rbKbzyEpi2hO7wIbUaETCK8Mlagz_3ft46UngDhqkNfGEILWsWzuqdNLWeHvlqBg/exec";

const CATS = { print: '인쇄물', banner: '마케팅판촉물' };
const CATS_LONG = { print: '인쇄물', banner: '마케팅판촉물(배너)' };
const TABS = { general: '병원 홍보물', sales: '영업부 전용' };
const SERIES = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
const MAX_UPLOAD_MB = 25;

let TOKEN = '';
let DB = null;                 // bootstrap 결과
let current = 'orders';
const imgCache = {};           // Drive fileId → dataURL
const ui = {
  orders: { from: '', to: '', status: '', q: '', cat: 'print', page: 0, sel: {}, histPage: 0 },
  stock:  { month: '', onlyTracked: true, logTab: 'in', logPage: 0 },
  catalog:{ mode: 'edit', tab: 'general', device: 'pc', draft: null, base: '', selId: null },
  drafts: { item: '', q: '' },
  work:   { month: '', day: '', view: 'day', doneLimit: 10, expanded: {} },
  settings: { tab: 'basic', doc: 'shipOrder', docDraft: {}, docListDraft: null, flow: 'print', flowDraft: {} },
  stats:  { view: 'month', month: '', range: '6m', basis: 'order', picked: null, slots: {} }
};
const charts = {};

/* ━━━━━━━━━━━━━━━━━━━━━━━━ 공통 유틸 ━━━━━━━━━━━━━━━━━━━━━━━━ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ── 문구 서식: 굵게(<b>)와 글씨 크기(<span class="fs-s|fs-l|fs-xl">)만 허용하는 안전한 서식 ──
//    저장 형식 = 위 태그만 쓴 한 줄 HTML, 여러 줄은 \n 으로 구분. 예전 **굵게** 표기도 그대로 읽음
// 글씨 크기 6단계 = 편집기 <font size> 1~6. 3(100%)이 기본 크기
const RICH_SIZES = { xs: ['1', 75], s: ['2', 85], l: ['4', 120], xl: ['5', 145], xxl: ['6', 170] };   // [편집기 <font size> 값, 원래 크기 대비 %]
// 크기 지정: fs-* 클래스 또는 편집기의 <font size>. size 3(보통)은 'n' = 크기 지정 해제
function richSizeKey(el) {
  const cls = (el.className || '').match(/\bfs-(xs|s|l|xl|xxl)\b/);
  if (cls) return cls[1];
  const v = el.tagName === 'FONT' ? el.getAttribute('size') : null;
  if (v === '3') return 'n';
  return Object.keys(RICH_SIZES).find(k => RICH_SIZES[k][0] === v) || '';
}
// 크기는 글자 단위로 감싸 겹치지 않게(작게 안에 크게 → 크게만 적용)
function richWalk(node, size) {
  let out = '';
  node.childNodes.forEach(n => {
    if (n.nodeType === 3) {
      const t = n.nodeValue.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      if (t) out += size ? `<span class="fs-${size}">${t}</span>` : t;
      return;
    }
    if (n.nodeType !== 1) return;
    const t = n.tagName;
    if (/^(SCRIPT|STYLE|TEMPLATE|IFRAME|OBJECT|TEXTAREA|NOSCRIPT)$/.test(t)) return;
    const key = (t === 'SPAN' || t === 'FONT') ? richSizeKey(n) : '';
    const inner = richWalk(n, key === 'n' ? '' : (key || size));
    const bold = t === 'B' || t === 'STRONG' || /^(bold|[6-9]00)$/.test(n.style && n.style.fontWeight || '');
    if (t === 'BR') out += '<br>';
    else if (t === 'DIV' || t === 'P' || t === 'LI') out += (out && !out.endsWith('<br>') ? '<br>' : '') + inner;
    else if (!inner) return;
    else out += bold ? `<b>${inner}</b>` : inner;
  });
  return out.replace(/<\/span><span class="(fs-[a-z]+)">/g, (m, c, i, s) => {
    // 같은 크기의 이웃 span 합치기
    const prev = s.lastIndexOf('<span class="', i);
    return s.startsWith(`<span class="${c}">`, prev) ? '' : m;
  });
}
// 저장값(한 줄) → 화면용 안전한 HTML
function richHTML(src) {
  let s = String(src == null ? '' : src);
  if (!/<[a-z]/i.test(s)) s = s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const tpl = document.createElement('template');   // template 안의 HTML은 실행·로딩되지 않음
  tpl.innerHTML = s;
  return richWalk(tpl.content);
}
const rich = s => String(s == null ? '' : s).split('\n').map(richHTML).join('<br>');
const pad = n => String(n).padStart(2, '0');
const toDate = s => s instanceof Date ? s : new Date(String(s).replace(' ', 'T'));
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ym = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const iso = d => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const fmtDT = s => { if (!s) return ''; const d = toDate(s); return isNaN(d) ? s : `${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtD = s => s ? fmtDT(s).slice(0, 10) : '';
const nf = n => Number(n || 0).toLocaleString('ko-KR');
const fileStamp = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
const isFileId = s => s && !/^(https?:|data:|blob:)/.test(s) && s.length > 10;
const itemById = id => DB.items.find(i => i.id === Number(id));
const sizeStr = b => !b ? '' : b > 1048576 ? (b/1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(b/1024)) + 'KB';

function weekRange(offset = 0) {
  const now = new Date();
  const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (now.getDay() + 6) % 7 + offset * 7);
  const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
  return [ymd(mon), ymd(sun)];
}
function inRange(s, from, to) {
  const d = fmtD(s);
  return (!from || d >= from) && (!to || d <= to);
}

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg;
  t.className = 'toast' + (err ? ' error' : '') + ' show';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200);
}
function refocus(sel) { const el = $(sel); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
function busy(on, msg) { $('#busy').classList.toggle('hidden', !on); $('#busy-msg').textContent = msg || '처리 중...'; }

function modal({ title, body, foot, wide, onMount }) {

  if (onMount) onMount(root);
}
function closeModal() { $('#modal-root').innerHTML = ''; }
function confirmBox(title, html, okLabel = '확인', danger) {

async function saveXlsx(filename, sheets) {
  if (typeof ExcelJS === 'undefined') { toast('엑셀 라이브러리를 불러오지 못했습니다. 네트워크를 확인해 주세요.', true); return; }
  const wb = new ExcelJS.Workbook();
  sheets.forEach(sh => {
    const ws = wb.addWorksheet(sh.name.replace(/[\\/?*\[\]:]/g, '').slice(0, 31), { views: [{ state: 'frozen', ySplit: 1 }] });
    sh.rows.forEach(r => ws.addRow(r));
    (sh.widths || []).forEach((w, i) => { ws.getColumn(i + 1).width = w; });
    (sh.rows[0] || []).forEach((_, i) => Object.assign(ws.getCell(1, i + 1), {
      font: { bold: true }, fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEECE1' } } }));
  });
  const buf = await wb.xlsx.writeBuffer();
  deliverFile(filename, new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }),
    ARTIFACT ? sheets.map(sh => `<p class="sub-line" style="margin:8px 0 6px">${esc(sh.name)} · ${sh.rows.length - 1}행</p>
      <div class="tbl-wrap"><table class="xl"><thead><tr>${sh.rows[0].map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${sh.rows.slice(1, 31).map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      ${sh.rows.length > 31 ? `<p class="sub-line">… 외 ${sh.rows.length - 31}행</p>` : ''}`).join('') : null);
}
// 파일 저장. 미리보기(아티팩트)에서는 다운로드가 막혀 있으므로 생성될 내용을 화면에 보여줌
function deliverFile(name, blob, previewHtml) {
  if (ARTIFACT) return showFilePreview(name, previewHtml || '', '미리보기 환경에서는 파일 다운로드가 차단되어 있어, 실제로 생성될 엑셀 내용을 화면으로 보여드립니다.');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  if (previewHtml) { deliverFile._last = { name, blob }; showFilePreview(name, previewHtml, '엑셀 파일을 내려받았습니다. 아래는 파일 내용입니다.', true); }
}
function showFilePreview(name, html, note, canRedownload) {
  modal({ title: `<i class="ti ti-file-spreadsheet" style="color:var(--ok)"></i> ${esc(name)}`, wide: true,
    body: `<div class="note"><i class="ti ti-info-circle"></i>${note}</div>${html}`,
    foot: `${canRedownload ? `<button class="btn" onclick="deliverFile(deliverFile._last.name, deliverFile._last.blob)"><i class="ti ti-download"></i>다시 받기</button>` : ''}<button class="btn primary" onclick="closeModal()">닫기</button>` });
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
// 큰 이미지는 업로드 전에 1600px / JPEG 로 줄임 (신청 페이지 로딩 속도)
function shrinkImage(file) {
  return new Promise(res => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 800 * 1024) return res(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b && b.size < file.size ? new File([b], file.name.replace(/\.\w+$/, '.jpg'), { type: 'image/jpeg' }) : file), 'image/jpeg', 0.86);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => res(file);
    img.src = URL.createObjectURL(file);
  });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━ API ━━━━━━━━━━━━━━━━━━━━━━━━ */
async function api(action, data = {}) {
  if (DEMO) return Mock.call(action, data);
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                 body: JSON.stringify(Object.assign({ action, token: TOKEN }, data)) });
  } catch (e) { throw new Error('서버에 연결할 수 없습니다. 네트워크를 확인해 주세요.'); }
  const j = await res.json();
  if (j.error === 'AUTH') { sessionExpired(); throw new Error('세션이 만료되었습니다. 다시 로그인해 주세요.'); }
  if (!j.ok) throw new Error(j.error || '요청 실패');
  return j;
}

async function loadImg(v) {
  if (!v) return null;
  if (!isFileId(v)) return v;
  if (imgCache[v]) return imgCache[v];
  if (DEMO) return null;
  try {
    const r = await fetch(`${API_URL}?action=getImage&id=${encodeURIComponent(v)}&token=${TOKEN}`);
    const j = await r.json();
    if (!j.data) return null;
    return (imgCache[v] = `data:${j.mimeType};base64,${j.data}`);
  } catch (e) { return null; }
}

async function upload(file, kind) {
  if (file.size > MAX_UPLOAD_MB * 1048576) throw new Error(`${MAX_UPLOAD_MB}MB 이하 파일만 업로드할 수 있습니다. 큰 파일은 드라이브 링크로 등록해 주세요.`);
  const base64 = await fileToBase64(file);
  return api('uploadFile', { kind, name: file.name, mimeType: file.type || 'application/octet-stream', base64 });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━ 로그인 ━━━━━━━━━━━━━━━━━━━━━━━━ */
async function doLogin(e) {
  e.preventDefault();
  const code = $('#login-code').value;
  const btn = $('#login-btn'); btn.disabled = true; btn.textContent = '확인 중...';
  $('#login-err').textContent = '';
  try {
    const r = await api('login', { code });
    TOKEN = r.token;
    try { sessionStorage.setItem('wc-admin-token', TOKEN); } catch (_) {}
    $('#login-code').value = '';
    await enterApp();
  } catch (err) {
    $('#login-err').textContent = err.message;
  } finally { btn.disabled = false; btn.textContent = '관리자 페이지 진입'; }
}
async function enterApp() {
  busy(true, '데이터 불러오는 중...');
  try {
    await refreshAll();
    $('#login-view').classList.add('hidden');
    $('#app-view').classList.remove('hidden');

    try { sec = sessionStorage.getItem('wc-admin-sec') || 'orders'; } catch (_) {}
    if (!document.getElementById('sec-' + sec)) sec = 'orders';

  } finally { busy(false); }
}
function sessionExpired() {
  TOKEN = '';
  try { sessionStorage.removeItem('wc-admin-token'); } catch (_) {}
  $('#app-view').classList.add('hidden');
  $('#login-view').classList.remove('hidden');
  $('#login-err').textContent = '세션이 만료되었습니다. 다시 로그인해 주세요.';

function pager(total, page, size, fn) {
  const pages = Math.ceil(total / size);
  if (pages <= 1) return '';
  const nums = [];
  for (let i = Math.max(0, page - 2); i <= Math.min(pages - 1, page + 2); i++) nums.push(i);
  const b = (p, label, extra = '') => `<button class="pg ${p === page && !extra ? 'on' : ''}" ${p < 0 || p >= pages || (p === page && extra) ? 'disabled' : ''} onclick="${fn}(${p})" ${extra}>${label}</button>`;
  return `<nav class="pager" aria-label="페이지">
    ${b(0, '<i class="ti ti-chevrons-left"></i>', 'aria-label="처음"')}${b(page - 1, '<i class="ti ti-chevron-left"></i>', 'aria-label="이전"')}
    ${nums[0] > 0 ? '<span class="pg-gap">…</span>' : ''}${nums.map(i => b(i, i + 1)).join('')}${nums[nums.length - 1] < pages - 1 ? '<span class="pg-gap">…</span>' : ''}
    ${b(page + 1, '<i class="ti ti-chevron-right"></i>', 'aria-label="다음"')}${b(pages - 1, '<i class="ti ti-chevrons-right"></i>', 'aria-label="끝"')}
    <span class="pg-info">${page * size + 1}–${Math.min(total, (page + 1) * size)} / 총 ${total}건</span></nav>`;
}

function summarize(orders, cat) {
  const items = {};
  orders.forEach(o => linesOf(o, cat).forEach(l => {
    const t = items[l.id] || (items[l.id] = { id: l.id, name: l.name, qty: 0, orders: 0, qtyUnit: l.qtyUnit });
    t.qty += Number(l.qty); t.orders++;
  }));
  return Object.values(items).sort((a, b) => b.qty - a.qty);
}

/* ── 업체 배송지 리스트 엑셀 (첨부 양식: '글로벌프린팅 배송지 리스트') ──
   시트1  B3:B4 no. / C 수령자 / D 연락처 / E 주소 / F~ 신청 홍보물품 항목&수량 (품목별 열, 2행에 단위) / 마지막 행 총 합계
   시트2  시안번호 및 박스수량: 번호 / 품목 / 형태 / 사이즈 / 박스당 수량(장)
   품목 열은 해당 분류의 게시 중인 홍보물 전체(신청 페이지 편집 순서)이며, 번호가 시트2의 시안번호와 같습니다. */
function deliveryColumns(cat, orders) {
  const used = new Set();
  orders.forEach(o => linesOf(o, cat).forEach(l => used.add(Number(l.id))));
  const cols = DB.items.filter(it => it.category === cat && (it.active || used.has(it.id)))
    .map(it => ({ id: it.id, name: it.name, qtyUnit: it.qtyUnit, form: it.form, size: it.size, perBox: it.perBox }));
  // 카탈로그에서 삭제된 품목이 신청에 남아 있는 경우
  orders.forEach(o => linesOf(o, cat).forEach(l => { if (!cols.find(c => c.id === Number(l.id))) cols.push({ id: Number(l.id), name: l.name, qtyUnit: l.qtyUnit }); }));
  return cols;
}
function deliveryAddress(o) {
  return [o.postcode ? `(${o.postcode})` : '', o.addr, o.addrDetail].filter(Boolean).join(' ') + (o.org ? ` [${o.org}]` : '');
}
function deliveryData(bt) {
  const cat = bt.category || 'print';
  const orders = DB.orders.filter(o => bt.orderIds.includes(o.orderId)).sort((a, b) => a.createdAt > b.createdAt ? 1 : -1);
  const cols = deliveryColumns(cat, orders);
  const rows = orders.map((o, i) => ({ no: i + 1, name: o.name, phone: o.phone, addr: deliveryAddress(o),
    q: cols.map(c => linesOf(o, cat).filter(l => Number(l.id) === c.id).reduce((s, l) => s + Number(l.qty), 0) || null) }));
  const totals = cols.map((c, i) => rows.reduce((s, r) => s + (r.q[i] || 0), 0));
  const vendor = (cat === 'print' ? DB.content.vendorPrint : DB.content.vendorBanner) || '';
  return { cat, cols, rows, totals, vendor, sheetName: `${vendor ? vendor + ' ' : ''}배송지 리스트`.replace(/[\\/?*\[\]:]/g, '').slice(0, 31) };
}

async function exportBatch(batchId, opts = {}) {
  const bt = DB.batches.find(b => b.batchId === batchId);
  if (!bt) return;
  const d = deliveryData(bt);
  if (!d.rows.length) return toast('취합에 포함된 신청 건을 찾을 수 없습니다.', true);
  const fname = `${d.sheetName}_${CATS[d.cat]}_${fileStamp(toDate(bt.createdAt))}.xlsx`;
  const preview = deliveryPreviewHTML(d, bt);
  if (typeof ExcelJS === 'undefined') { if (opts.blobOnly) return null; showFilePreview(fname, preview, '엑셀 라이브러리를 불러오지 못해 화면으로만 보여드립니다.'); return; }
  // 업체 양식(글로벌프린팅 빈 양식 파일)과 같은 모양. 인쇄물·마케팅판촉물 모두 같은 양식
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(d.sheetName, { properties: { defaultColWidth: 12.63, defaultRowHeight: 15.75 } });
  const lastCol = 5 + d.cols.length, L = n => ws.getColumn(n).letter;
  const thin = { style: 'thin', color: { argb: 'FF000000' } }, border = { top: thin, left: thin, bottom: thin, right: thin };
  const solid = argb => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
  const head = { font: { name: '맑은 고딕', size: 11, bold: true }, fill: solid('FFEEECE1'), alignment: { horizontal: 'center', vertical: 'middle', wrapText: true }, border };
  [3.38, 9.63, 15.75, 17.75, 65.5].forEach((w, i) => { ws.getColumn(i + 1).width = w; });

const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addD = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const mdw = s => { const d = parseD(s); return `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`; };
const lastWeekOfMonth = s => { const d = parseD(s); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() - d.getDate() < 7; };

// 업무 1건 + 자동 확인 상태를 합친 화면용 데이터
function jobView(j) {
  const bt = j.batchId ? DB.batches.find(b => b.batchId === j.batchId) : null;
  const cat = jobCat(j);
  const catItems = new Set(DB.items.filter(i => i.category === cat).map(i => i.id));
  const stockIn = DB.stockLog.some(l => l.type === 'IN' && catItems.has(l.itemId) && fmtD(l.date) >= j.baseDate);
  const steps = (j.steps || []).map((s, idx) => {
    const auto = s.auto === 'batch' ? !!bt : s.auto === 'stockIn' ? stockIn : false;
    const doneAt = s.done ? s.doneAt : auto && s.auto === 'batch' && bt ? bt.createdAt : '';
    // 예전에 만든 체크리스트의 메일 발송 단계는 '배송지 엑셀 받기' + 직접 체크로 표시
    return Object.assign({}, s, { idx, auto, done: !!s.done || auto, doneAt }, s.act === 'mail' ? { act: 'xlsx', auto: false, done: !!s.done } : {});
  });
  const doneCount = steps.filter(s => s.done).length;
  return Object.assign({}, j, { bt, cat, steps, doneCount, complete: steps.length > 0 && doneCount === steps.length, batchMissing: !!j.batchId && !bt });
}
const allJobs = () => (DB.jobs || []).map(jobView).sort((a, b) => a.baseDate < b.baseDate ? 1 : a.baseDate > b.baseDate ? -1 : (a.createdAt < b.createdAt ? 1 : -1));

function workSummary() {
  const today = ymd(new Date()), [wf, wt] = weekRange(0);
  const jobs = allJobs(), open = jobs.filter(j => !j.complete);
  return { open, remain: open.reduce((a, j) => a + j.steps.length - j.doneCount, 0),
           weekNew: jobs.filter(j => j.baseDate >= wf && j.baseDate <= wt).length,
           doneToday: jobs.reduce((a, j) => a + j.steps.filter(s => s.done && fmtD(s.doneAt) === today).length, 0) };
}

// 날짜별 상태: 그날 시작한(취합한) 업무 중 덜 끝난 게 있으면 ⏳, 모두 끝났으면 ✅
function dayStatus(jobs, d) {
  const started = jobs.filter(j => j.baseDate === d);
  if (!started.length) return null;
  const open = started.filter(j => !j.complete);
  return open.length ? { icon: '⏳', cls: 'pending', title: `처리 덜 된 업무 ${open.length}건 (남은 단계 ${open.reduce((a, j) => a + j.steps.length - j.doneCount, 0)}개)` }
                     : { icon: '✅', cls: 'clear', title: '이날 시작한 업무 모두 완료' };
}
function renderWork() {

  const first = new Date(y, m - 1, 1), last = new Date(y, m, 0);
  const gridFrom = addD(ymd(first), -((first.getDay() + 6) % 7)), gridTo = addD(ymd(last), (7 - last.getDay()) % 7);

    j.steps.forEach(s => { if (s.done && s.k !== 'collect') put(fmtD(s.doneAt), { j, label: shortStep(j, s), kind: 'done' }); }); });
  const days = [];
  for (let d = gridFrom; d <= gridTo; d = addD(d, 1)) days.push(d);
  // 아래 목록
  const d = u.day;
  const startedDay = jobs.filter(j => j.baseDate === d);
  const doneDay = jobs.filter(j => j.baseDate !== d && j.steps.some(s => s.done && s.k !== 'collect' && fmtD(s.doneAt) === d));
  const openList = jobs.filter(j => !j.complete), doneList = jobs.filter(j => j.complete);
  const pendingDays = [...new Set(openList.map(j => j.baseDate))].sort();
  const unset = !w.shipUnitPrice;
  const st = dayStatus(jobs, d);

  let listHTML;
  if (u.view === 'day') {
    listHTML = (startedDay.length || doneDay.length) ? `
      ${startedDay.length ? `<h4 class="wk-sub">이날 시작한 업무 ${startedDay.length}건</h4><div class="wk-list">${startedDay.map(j => jobCard(j, d)).join('')}</div>` : ''}
      ${doneDay.length ? `<h4 class="wk-sub">이날 처리한 단계 <span class="sub">다른 날 시작한 업무</span></h4><div class="wk-list">${doneDay.map(j => jobCard(j, d, true)).join('')}</div>` : ''}`

const rawJob = id => (DB.jobs || []).find(j => j.jobId === id);
async function saveJobSteps(jobId, mutate, extra = {}) {
  const j = rawJob(jobId);
  if (!j) return toast('업무를 찾을 수 없습니다. 새로고침해 주세요.', true);
  const steps = JSON.parse(JSON.stringify(j.steps || []));
  mutate(steps);
  const r = await api('saveJob', Object.assign({ jobId, steps }, extra));
  const nj = r.job || Object.assign({}, j, { steps }, extra);
  DB.jobs = DB.jobs.map(x => x.jobId === jobId ? nj : x);
  updateBadges();
  if (current === 'work') renderWork();
}
async function toggleJobStep(jobId, idx, on) {

/* ── 수령자별 박스 수: 박스 단위 품목은 신청 수량 = 박스 수, 개 단위 품목(캘린더 등)은 설정의 'N개당 1박스'로 올림 계산 ── */
const BOX_PER_DEFAULT = 10;
function boxPerOf(itemId, w = workSettings()) { return Number((w.boxPer || {})[itemId]) || BOX_PER_DEFAULT; }
function batchBoxes(bt, w = workSettings()) {
  const d = deliveryData(bt);
  const rows = d.rows.map(r => {
    const nums = [];
    const boxes = r.q.reduce((sum, q, i) => {
      if (!q) return sum;
      nums.push(i + 1);   // 품목 번호 = 배송지 리스트 엑셀의 품목 열 번호
      const c = d.cols[i];
      return sum + ((c.qtyUnit || '박스') === '박스' ? Number(q) : Math.ceil(Number(q) / boxPerOf(c.id, w)));
    }, 0);
    return { no: r.no, name: r.name, nums, boxes };
  });
  return { rows, total: rows.reduce((a, r) => a + r.boxes, 0) };
}
// 기안에 붙여 넣는 약식 표: 전각 공백(　)으로 칸을 맞춤
function boxTableText(bx) {
  return ['수령자　*품목넘버/총 박스수', '', ...bx.rows.map(r => `　${r.no}　${r.name}　품목${r.nums.join(',')} / ${r.boxes}박스`)].join('\n');
}

/* ── 문서 문구 생성: 양식의 {변수}를 이번 업무의 값으로 채움 ── */
function docVars(jobId) {
  const j = jobView(rawJob(jobId)), w = workSettings(), bt = j.bt, cat = j.cat || 'print';
  const vendor = (cat === 'print' ? DB.content.vendorPrint : DB.content.vendorBanner) || '';
  const totals = bt ? Object.entries(bt.summary.totals || {}).map(([id, t]) => Object.assign({ id: Number(id) }, t)) : [];
  const v = { 업체명: vendor, 분류: CATS_LONG[cat], 작성일: ymd(new Date()), 발주월: `${j.baseDate.slice(0, 4)}년 ${Number(j.baseDate.slice(5, 7))}월` };
  if (bt) {
    const orders = DB.orders.filter(o => bt.orderIds.includes(o.orderId)).map(o => fmtD(o.createdAt)).sort();
    v.취합일 = mdw(fmtD(bt.createdAt));
    v.배송지수 = nf(bt.orderIds.length);
    v.품목요약 = totals.map(t => `${t.name} ${nf(t.qty)}${t.qtyUnit || ''}`).join(', ');
    v.수량합계 = nf(totals.reduce((a, t) => a + Number(t.qty), 0));
    if (orders.length) v.기간 = `${mdw(orders[0])}~${mdw(orders[orders.length - 1])}`;   // 취합에 들어간 신청의 실제 접수 기간
    const bx = batchBoxes(bt, w);
    if (bx.rows.length) { v.수령자별내역 = boxTableText(bx); v.총박스수 = nf(bx.total); }
  }
  const inv = j.steps.find(s => s.k === 'invoice');
  if (inv && inv.data && inv.data.boxes) { v.박스수 = nf(inv.data.boxes); v.박스단가 = nf(inv.data.unit || w.shipUnitPrice); v.배송비 = nf(inv.data.fee); }
  if (cat === 'banner' && totals.length) {
    const lines = totals.map(t => { const price = Number((itemById(t.id) || {}).unitPrice) || 0; return { t, price, amt: price * Number(t.qty) }; });
    v.품목내역 = lines.map(x => `  - ${x.t.name} ${nf(x.t.qty)}${x.t.qtyUnit || ''} × ${x.price ? nf(x.price) + '원' : '{단가 미입력}'} = ${x.price ? nf(x.amt) + '원' : '-'}`).join('\n');
    if (lines.every(x => x.price)) {
      const supply = lines.reduce((a, x) => a + x.amt, 0), vat = Math.round(supply * 0.1);
      Object.assign(v, { 공급가액: nf(supply), 부가세: nf(vat), 합계금액: nf(supply + vat) });
    }
  }
  if (cat === 'print') Object.assign(v, { 지출제목: `[지출결의] ${v.취합일 || mdw(j.baseDate)} 취합분 홍보물(인쇄물) 배송비`,
    지출내용: `웰체크 홍보물(인쇄물) 배송비${v.박스수 ? ` (${v.박스수}박스, 배송지 ${v.배송지수 || '-'}곳)` : ''}`, 지출금액: v.배송비, 증빙: '송장 리스트, 배송비 발주·지급 기안' });
  else Object.assign(v, { 지출제목: `[지출결의] ${v.발주월} 마케팅판촉물 제작비`, 지출내용: `마케팅판촉물 제작 (${v.품목요약 || '-'})`, 지출금액: v.합계금액, 증빙: '세금계산서, 발주 기안' });
  return v;
}

}

/* ━━━━━━━━━━━━━━━━━━━━━━━━ 2. 재고관리 ━━━━━━━━━━━━━━━━━━━━━━━━ */
function stockFor(itemId, month) {
  const r = { carry: 0, inQ: 0, outQ: 0, adj: 0, end: 0 };
  DB.stockLog.forEach(l => {
    if (l.itemId !== Number(itemId)) return;
    const signed = l.type === 'OUT' ? -l.qty : l.qty;
    if (l.month < month) r.carry += signed;
    else if (l.month === month) { if (l.type === 'IN') r.inQ += l.qty; else if (l.type === 'OUT') r.outQ += l.qty; else r.adj += l.qty; }
  });
  r.end = r.carry + r.inQ - r.outQ + r.adj;
  return r;
}
function lowStockItems() {
  const m = ym(new Date());
  return DB.items.filter(it => it.active && it.trackStock && (stockFor(it.id, m).end < 0 || (it.safetyStock > 0 && stockFor(it.id, m).end < it.safetyStock)));
}

/* 재고 변동 이력 표: 행 = 홍보물, 열 = 날짜(발주일자 / 취합일자), 칸 = 그날 수량 합계
   입고 = 발주(IN) + 증가 조정(ADJ+), 출고 = 취합 차감(OUT) + 감소 조정(ADJ−). 출고 수량은 양수로 표시 */
function stockLogsOf(month, tab) {
  return DB.stockLog.filter(l => l.month === month && (tab === 'out'
    ? (l.type === 'OUT' || (l.type === 'ADJ' && l.qty < 0))
    : (l.type === 'IN' || (l.type === 'ADJ' && l.qty > 0))));
}
function stockPivot(month, tab, items) {
  const logs = stockLogsOf(month, tab);
  const dates = [...new Set(logs.map(l => fmtD(l.date)))].sort();
  const kindName = { IN: '발주', OUT: '취합', ADJ: '조정' };
  const kinds = {}, dayTotal = {};
  dates.forEach(d => { kinds[d] = [...new Set(logs.filter(l => fmtD(l.date) === d).map(l => kindName[l.type]))]; dayTotal[d] = 0; });
  // 표에 나올 품목: 화면의 재고 품목 + 이 달 기록이 있는 품목
  const ids = [...new Set([...items.map(i => i.id), ...logs.map(l => l.itemId)])];
  const order = DB.items.map(i => i.id);
  const rows = ids.sort((a, b) => order.indexOf(a) - order.indexOf(b)).map(id => {
    const it = itemById(id) || { id, name: '#' + id, category: 'print', qtyUnit: '', active: false };
    const cells = {}; let total = 0;
    logs.filter(l => l.itemId === id).forEach(l => {
      const d = fmtD(l.date), q = Math.abs(Number(l.qty));

/* 재고 일괄 조정: 여러 품목을 한 번에

function openAdjustBulk() {
  const today = ymd(new Date());
  const items = DB.items.filter(it => it.trackStock && (it.active || DB.stockLog.some(l => l.itemId === it.id)));
  const cur = id => stockFor(id, ym(new Date())).end;
  const rowsHTML = mode => items.map(it => `<tr>
      <td><b>${esc(it.name)}</b>${it.active ? '' : ' <span class="chip gray">숨김</span>'}</td>

      <td class="num"><input class="inp num adj-in" type="number" step="1" ${mode === 'count' ? 'min="0"' : ''} data-item="${it.id}" data-cur="${cur(it.id)}"
        placeholder="${mode === 'count' ? '실사 수량' : '예) -2'}" aria-label="${esc(it.name)} ${mode === 'count' ? '실사 수량' : '증감 수량'}"/></td>
      <td class="num adj-diff" data-item="${it.id}">-</td>
      <td><input class="inp adj-memo" data-item="${it.id}" placeholder="공통 사유 사용" aria-label="${esc(it.name)} 사유"/></td></tr>`).join('');

    body: `<div class="row">
        <div class="field"><label for="aj-date">조정일자 *</label><input type="date" class="inp" id="aj-date" value="${today}" max="${today}"/></div>
        <div class="field"><label>입력 방식</label><div class="seg" id="aj-mode"><button class="on" data-m="delta">증감 수량 입력</button><button data-m="count">실사 재고 입력</button></div></div>
        <div class="field" style="flex:1;min-width:200px"><label for="aj-memo">공통 사유 *</label><input class="inp" id="aj-memo" placeholder="예) 10월 창고 실사, 파손, 행사 샘플 사용"/></div></div>
      <p class="sub-line" id="aj-help">재고를 늘리면 +, 줄이면 − 수량을 넣으세요. 비워둔 품목은 바뀌지 않습니다.</p>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>홍보물</th><th class="num">현재고</th><th class="num" id="aj-col">증감 수량</th><th class="num">조정 후</th><th>품목별 사유 (선택)</th></tr></thead>
        <tbody id="aj-rows">${rowsHTML('delta')}</tbody></table></div>`,
    foot: `<span class="sub-line" id="aj-count" style="margin-right:auto">조정할 품목 0개</span><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="aj-ok">조정 저장</button>`,
    onMount: () => {
      let mode = 'delta';
      const deltaOf = i => { if (i.value === '') return 0; const v = Number(i.value); return mode === 'count' ? v - Number(i.dataset.cur) : v; };
      const refresh = () => {
        let n = 0;
        document.querySelectorAll('.adj-in').forEach(i => {
          const d = deltaOf(i), cell = document.querySelector(`.adj-diff[data-item="${i.dataset.item}"]`);
          if (i.value === '' || !d) { cell.innerHTML = '-'; return; }
          n++; const after = Number(i.dataset.cur) + d;
          cell.innerHTML = `<b class="${after < 0 ? 'neg' : ''}">${nf(after)}</b> <span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${nf(d)}</span>`;
        });
        $('#aj-count').textContent = `조정할 품목 ${n}개`;
      };
      const bind = () => document.querySelectorAll('.adj-in').forEach(i => i.oninput = refresh);
      document.querySelectorAll('#aj-mode button').forEach(b => b.onclick = () => {
        mode = b.dataset.m;
        document.querySelectorAll('#aj-mode button').forEach(x => x.classList.toggle('on', x === b));
        $('#aj-col').textContent = mode === 'count' ? '실사 수량' : '증감 수량';
        $('#aj-help').textContent = mode === 'count'
          ? '창고에서 센 실제 수량을 넣으면 현재고와의 차이만큼 자동으로 조정됩니다. 비워둔 품목은 바뀌지 않습니다.'
          : '재고를 늘리면 +, 줄이면 − 수량을 넣으세요. 비워둔 품목은 바뀌지 않습니다.';
        $('#aj-rows').innerHTML = rowsHTML(mode); bind(); refresh();
      });
      bind();
      $('#aj-ok').onclick = async () => {
        const date = $('#aj-date').value, memo = $('#aj-memo').value.trim();
        const inputs = [...document.querySelectorAll('.adj-in')];
        if (inputs.some(i => i.value !== '' && (!Number.isInteger(Number(i.value)) || (mode === 'count' && Number(i.value) < 0)))) return toast('수량은 정수로 입력해 주세요.', true);
        const entries = inputs.map(i => ({ itemId: Number(i.dataset.item), qty: deltaOf(i),
          memo: (document.querySelector(`.adj-memo[data-item="${i.dataset.item}"]`).value.trim()) || (mode === 'count' && memo ? `${memo} (실사 ${i.value})` : '') })).filter(e => e.qty);
        if (!date) return toast('조정일자를 선택해 주세요.', true);
        if (!entries.length) return toast(mode === 'count' ? '현재고와 다른 실사 수량이 없습니다.' : '조정할 수량을 하나 이상 입력해 주세요.', true);
        if (!memo && entries.some(e => !e.memo)) return toast('공통 사유를 입력하거나 품목별 사유를 모두 입력해 주세요.', true);
        busy(true);
        try {
          await api('addAdjusts', { date, memo, entries });
          closeModal(); Object.assign(ui.stock, { month: date.slice(0, 7), logPage: 0 });
          await refreshAll(); toast(`${entries.length}개 품목의 재고를 조정했습니다.`);
        } catch (e) { toast(e.message, true); } finally { busy(false); }
      };
    } });
}
async function deleteLog(id) {

function exportStock() {

function editCardHTML(it) {
  const src = it.img ? (imgCache[it.img] || (!isFileId(it.img) ? it.img : '')) : '';
  const pos = ui.catalog.draft.items.filter(x => x.tab === it.tab).indexOf(it) + 1;
  return `<div class="item-card ${it.active ? '' : 'off'} ${ui.catalog.selId === it.id ? 'is-sel' : ''}" data-id="${it.id}" onclick="openItemEditor(${it.id})">
    <div class="checkbox-wrap"></div><span class="card-order">${pos}</span>
    <div class="card-flags">
      <span class="chip ${it.category}">${CATS[it.category]}</span>
      ${it.active ? '' : '<span class="chip gray">숨김</span>'}${it.soldOut ? '<span class="chip red">품절</span>' : ''}
    </div>
    <div class="item-img" id="ed-img-${it.id}">${src ? `<img src="${esc(src)}" alt=""/>` : it.img ? '<div class="spinner"></div>' : '<div class="img-placeholder"><i class="ti ti-photo-plus" style="font-size:32px"></i><span>이미지 없음</span></div>'}</div>
    <p class="item-name">${esc(it.name) || '<span style="color:#DC2626">(이름 없음)</span>'}</p>
    ${it.unit && it.unit.includes('1인') ? `<p class="item-unit-special">📋 ${esc(it.unit)}</p>` : `<p class="item-unit">주문단위: ${esc(it.unit)}</p>`}
    <div class="card-actions"><div class="qty-row"><span class="qty-btn">−</span><span class="qty-display">0</span><span class="qty-btn">+</span><span class="qty-label">${esc(it.qtyUnit)}</span></div>
      <span class="pdf-btn ${it.pdf ? '' : 'none'}"><i class="ti ti-file-type-pdf"></i>${it.pdf ? 'PDF' : 'PDF 없음'}</span></div>
  </div>`;
}
function mountCatalogEdit() {
  const grid = $('#ed-grid');
  if (grid && typeof Sortable !== 'undefined') {
    Sortable.create(grid, { animation: 160, delay: 120, delayOnTouchOnly: true, onEnd: () => {
      const ids = [...grid.querySelectorAll('.item-card')].map(el => Number(el.dataset.id));
      const d = ui.catalog.draft, tab = ui.catalog.tab;
      const others = d.items.filter(it => it.tab !== tab);
      d.items = [...ids.map(id => d.items.find(it => it.id === id)), ...others];
      renderCatalog();
    } });
  }
  ui.catalog.draft.items.filter(it => it.tab === ui.catalog.tab && isFileId(it.img) && !imgCache[it.img]).forEach(async it => {
    const src = await loadImg(it.img); const el = document.getElementById('ed-img-' + it.id);
    if (el) el.innerHTML = src ? `<img src="${esc(src)}" alt=""/>` : '<div class="img-placeholder"><i class="ti ti-photo-off" style="font-size:32px"></i><span>불러오기 실패</span></div>';
  });
}

function catalogPreviewHTML() {
  const w = ui.catalog.device === 'mobile' ? 'max-width:390px;margin:0 auto;display:block' : '';
  return `<div class="note"><i class="ti ti-eye"></i>실제 신청 페이지(apply.html)에 편집 중인 내용을 넣어 보여주는 화면입니다. 숨김 처리한 홍보물은 보이지 않습니다.</div>
    <iframe class="preview-frame" id="pv-frame" style="${w}" src="${APPLY_PAGE_URL}?preview=1" title="신청 페이지 미리보기"></iframe>`;
}
let pvListener = null;
function mountPreview() {
  if (pvListener) window.removeEventListener('message', pvListener);
  pvListener = async e => {
    const f = $('#pv-frame');
    if (!e.data || !f || e.source !== f.contentWindow) return;
    if (e.data.type === 'wc-preview-height') { f.style.height = Math.max(400, Number(e.data.h) || 0) + 'px'; return; }
    if (e.data.type !== 'wc-preview-ready') return;
    const d = ui.catalog.draft;
    const items = d.items.filter(it => it.active);
    await Promise.all(items.map(it => loadImg(it.img)));
    const cache = {}; items.forEach(it => { if (imgCache[it.img]) cache[it.img] = imgCache[it.img]; });
    f.contentWindow.postMessage({ type: 'wc-preview', tab: ui.catalog.tab, imageCache: cache, page: {
      content: d.content, videos: d.videos.filter(v => v.active !== false),
      items: items.map(it => ({ id: it.id, name: it.name, unit: it.unit, tab: it.tab, pdf: it.pdf, img: it.img, qtyUnit: it.qtyUnit, soldOut: it.soldOut, maxQty: it.maxQty })) } }, '*');
  };
  window.addEventListener('message', pvListener);
}

function addItem() {
  const d = ensureDraft();
  const tmpId = -Date.now();
  d.items.push({ id: tmpId, order: 0, tab: ui.catalog.tab, category: 'print', name: '새 홍보물', unit: '1박스(100매)', qtyUnit: '박스',
                 pdf: '', img: '', active: true, soldOut: false, maxQty: 0, trackStock: true, safetyStock: 0, form: '', size: '', perBox: 0, unitPrice: 0, memo: '' });
  if (ui.catalog.mode !== 'edit') ui.catalog.mode = 'edit';
  renderCatalog();
  openItemEditor(tmpId);
  revealCard(tmpId);
}

// 편집 패널이 열리면 본문을 패널 너비만큼 비켜서, 오른쪽 카드가 패널에 가려지지 않게 함 (넓은 화면)
function openDrawer(html) { if (ui.catalog.contentOpen) setContentOpen(false); const dr = $('#drawer'); dr.innerHTML = html; dr.classList.add('open'); document.body.classList.add('drawer-open'); }
// 카드가 화면(상단 고정 도구줄 아래)에 다 보이도록 스크롤
function revealCard(id) {
  requestAnimationFrame(() => setTimeout(() => {
    const el = document.querySelector(`#ed-grid .item-card[data-id="${id}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 220));
}
function closeDrawer() {
  if (ui.catalog.contentOpen) setContentOpen(false);
  document.body.classList.remove('drawer-open');
  $('#drawer').classList.remove('open');
  if (ui.catalog.selId != null) { ui.catalog.selId = null; document.querySelectorAll('#ed-grid .item-card.is-sel').forEach(e => e.classList.remove('is-sel')); }
}

  openDrawer(`

function setItem(id, key, val, rerender) {

  it[key] = val;

  // 카드만 다시 그리고 드로어는 유지
  const keepSel = ui.catalog.selId;
  renderCatalog(); ui.catalog.selId = keepSel;

}
async function uploadItemImage(id, file) {
  if (!file) return;
  busy(true, '이미지 업로드 중...');
  try {
    const small = await shrinkImage(file);
    const r = await upload(small, 'image');
    imgCache[r.fileId] = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(small); });
    setItem(id, 'img', r.fileId, true);
    toast('이미지를 올렸습니다. 저장하고 게시해야 신청 페이지에 반영됩니다.');
  } catch (e) { toast(e.message, true); } finally { busy(false); }
}
async function uploadItemPdf(id, file) {
  if (!file) return;
  if (file.type !== 'application/pdf') return toast('PDF 파일만 올릴 수 있습니다.', true);
  busy(true, 'PDF 업로드 중...');
  try {
    const r = await upload(file, 'pdf');
    setItem(id, 'pdf', r.viewUrl || r.url, true);
    toast(r.shared === false ? 'PDF를 올렸지만 외부 공유가 제한되어 있습니다. 드라이브에서 공유 설정을 확인해 주세요.' : 'PDF를 올렸습니다.', r.shared === false);
  } catch (e) { toast(e.message, true); } finally { busy(false); }
}
function duplicateItem(id) {
  const d = ui.catalog.draft, it = d.items.find(x => x.id === id);
  const copy = Object.assign({}, it, { id: -Date.now(), name: it.name + ' (복사본)', active: false });
  d.items.splice(d.items.indexOf(it) + 1, 0, copy);
  renderCatalog(); openItemEditor(copy.id); revealCard(copy.id);
  toast('복사본은 숨김 상태로 추가됩니다.');
}
async function removeItem(id) {
  const ordered = id > 0 && (DB.orders.some(o => o.items.some(l => l.id === id)) || DB.stockLog.some(l => l.itemId === id));
  const ok = await confirmBox('홍보물 삭제', ordered
    ? '신청·재고 이력이 있는 홍보물이라 완전히 지우지 않고 <b>숨김 상태로 보관</b>됩니다. (통계·지난 신청 내역 유지)<br>계속할까요?'
    : '이 홍보물을 목록에서 삭제할까요? 저장하고 게시해야 최종 반영됩니다.', '삭제', true);

// 페이지 문구 편집: 구역을 골라 그 구역 문구만 편집. rich = 굵게·글씨 크기 서식 편집기, 나머지는 한 줄 입력

// 서식 편집기: 굵게 / 색상 / 서식 지우기. 결과는 굵게·지정 색상만 남기고 저장
function richEditorHTML(k, val) {
  const lines = String(val == null ? '' : val).split('\n');
  return `<div class="rte">
    <div class="rte-bar" role="toolbar" aria-label="글씨 서식">
      <button type="button" class="rte-btn" title="굵게 (Ctrl+B)" onmousedown="event.preventDefault();rteCmd('${k}','bold')"><b>B</b></button>

        <button type="button" class="rte-pct" id="rsz-${k}" title="기본 크기(100%)로" onmousedown="event.preventDefault();rteStep('${k}',0)">100%</button>
        <button type="button" id="rsz-up-${k}" title="글씨 크게 (Ctrl+])" aria-label="글씨 크게" onmousedown="event.preventDefault();rteStep('${k}',1)">+</button></span>
      <span class="rte-sep"></span>

// 편집기 안에서는 크기를 <font size>로 보여 줘야 브라우저 크기 명령이 기존 크기를 바로 바꿈

// 문구 편집 창이 열려 있는 동안 고른 구역을 강조하고, 필요하면 그 구역으로 스크롤

  const needClosedPreview = on && ui.catalog.contentSec === 'closed';
  const ed = $('#sec-catalog .wc');

  else document.querySelectorAll('.wc [data-csec]').forEach(el => el.classList.toggle('sec-hl', on && el.dataset.csec === ui.catalog.contentSec));
  if (!on || !scroll) return;

    const el = document.querySelector(`.wc [data-csec="${ui.catalog.contentSec}"]`);
    if (!el) return;
    const bar = document.querySelector('.cat-toolbar'), top = (bar ? bar.getBoundingClientRect().bottom : 0) + 16;
